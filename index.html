<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fav-deco</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EFEDE8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Déco">
<style>
/* ---------------------------------------------------------------
   fav-deco - favoris meubles partagés
   Direction : interface de collection d'images (Pinterest / Are.na).
   L'UI se tait, les photos parlent. Palette achromatique volontaire :
   la couleur vient des meubles. Fond greige pour détacher les
   visuels produit, qui sont presque tous shootés sur fond blanc.
   --------------------------------------------------------------- */
:root{
  /* Neutres chauds - 90% de l'interface */
  --n-0:#FFFFFF;
  --n-50:#F7F5F1;
  --n-100:#EFEDE8;
  --n-200:#E3E0D9;
  --n-300:#CFCBC2;
  --n-400:#A8A399;
  --n-500:#7D7871;
  --n-600:#5A5650;
  --n-900:#1C1A17;

  --bg:var(--n-100);
  --surface:var(--n-0);
  --text:var(--n-900);
  --text-muted:var(--n-600);
  --text-subtle:var(--n-500);
  --border:var(--n-200);
  --border-strong:var(--n-300);

  /* Accent = encre. Aucune couleur, pour ne pas concurrencer les photos. */
  --primary:var(--n-900);
  --on-primary:var(--n-0);

  --danger:#A8342B;

  --r-img:10px;
  --r-pill:999px;
  --gouttiere:14px;

  --ease:cubic-bezier(.3,.7,.4,1);
}
*{box-sizing:border-box}
/* display:flex sur .actions-feuille écrase la règle UA de [hidden], d'où ce rappel */
[hidden]{display:none !important}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}

/* ---------- En-tête ---------- */
.tete{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .2s;
  padding-top:env(safe-area-inset-top);
}
.tete[data-colle]{border-bottom-color:var(--border)}
.tete-haut{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px 10px;
  max-width:1400px;margin:0 auto;
}
.marque{
  font-size:16px;font-weight:600;letter-spacing:-.02em;margin:0;
  display:flex;align-items:baseline;gap:8px;
}
.compte{
  font-size:12px;font-weight:400;color:var(--text-subtle);
  font-variant-numeric:tabular-nums;
}
.tete-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{
  border:1px solid var(--border-strong);background:var(--surface);
  border-radius:var(--r-pill);padding:8px 14px;font-size:14px;font-weight:500;
  transition:background .15s,border-color .15s,transform .1s var(--ease);
}
.btn:hover{background:var(--n-50);border-color:var(--n-400)}
.btn:active{transform:scale(.97)}
.btn--primaire{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn--primaire:hover{background:#332F2A;border-color:#332F2A}
.btn--fantome{border-color:transparent;background:transparent;color:var(--text-muted);padding:8px 10px}
.btn--fantome:hover{background:var(--n-200);color:var(--text)}
.btn--danger{color:var(--danger)}
.btn:disabled{opacity:.35;cursor:default;pointer-events:none}

/* ---------- Filtres ---------- */
.barre{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:0 16px 10px;max-width:1400px;margin:0 auto;
}
.barre:last-child{padding-bottom:12px}
.seg{
  display:inline-flex;flex:0 0 auto;background:var(--n-200);
  border-radius:var(--r-pill);padding:3px;gap:2px;
}
.seg button{
  border:none;background:none;border-radius:var(--r-pill);
  padding:6px 12px;font-size:13px;color:var(--text-muted);white-space:nowrap;
  transition:background .15s,color .15s;
}
.seg button[aria-pressed="true"]{
  background:var(--surface);color:var(--text);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.09);
}

/* Choix du nombre de colonnes, à la manière des sites e-commerce */
.cols{display:inline-flex;flex:0 0 auto;gap:2px;background:var(--n-200);border-radius:var(--r-pill);padding:3px}
.cols button{
  border:none;background:none;border-radius:var(--r-pill);padding:6px 8px;
  display:grid;place-items:center;color:var(--text-subtle);line-height:0;
  transition:background .15s,color .15s;
}
.cols button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.09)}
.cols svg{display:block}

.btn--petit{padding:6px 11px;font-size:13px}
.btn--actif{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn--actif:hover{background:#332F2A;color:var(--on-primary)}

.filtre-label{
  flex:0 0 auto;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-subtle);white-space:nowrap;
}
.filtres{
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  flex:1;min-width:0;
  -webkit-overflow-scrolling:touch;
}
.barre:has(.filtres:empty){display:none}
.filtres::-webkit-scrollbar{display:none}
.puce{
  flex:0 0 auto;border:1px solid var(--border-strong);background:transparent;
  border-radius:var(--r-pill);padding:6px 13px;font-size:13.5px;white-space:nowrap;
  color:var(--text-muted);
  transition:background .15s,color .15s,border-color .15s;
}
.puce:hover{border-color:var(--n-400);color:var(--text)}
.puce[aria-pressed="true"]{
  background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:500;
}
.puce .n{opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}
.select-mag{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  border-radius:var(--r-pill);padding:6px 13px;font-size:13.5px;max-width:240px;
}

/* ---------- Grille en colonnes (hauteurs libres) ---------- */
#contenu{max-width:1400px;margin:0 auto;padding:10px 16px 80px}

/* Vue par catégorie : les sections coulent en colonnes, pour que deux
   petites catégories se retrouvent côte à côte au lieu de prendre
   chacune une ligne entière. Les vignettes ont un ratio fixe, donc leur
   hauteur est connue avant le chargement des photos : c'est ce qui rend
   ce découpage en colonnes fiable ici. */
/* Grille, et non colonnes libres : les rangées démarrent toutes à la
   même hauteur. Les colonnes libres décalaient les sections les unes par
   rapport aux autres dès que leurs hauteurs différaient. */
#contenu[data-vue="cat"]{display:grid;gap:4px 30px;align-items:start}
#contenu[data-vue="cat"][data-col="1"]{grid-template-columns:1fr}
#contenu[data-vue="cat"][data-col="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
#contenu[data-vue="cat"][data-col="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}

/* Séparation entre colonnes de catégories : un trait posé dans l'espace
   entre les colonnes (pseudo-élément), jamais une bordure/un padding sur
   la section elle-même. Un border-left grignotait 27px de largeur côté
   droit, donc ses vignettes finissaient plus petites que celles de la
   colonne de gauche : la 1ère demande était « toutes les images à
   l'écran de la même taille ». */
.section{position:relative}
#contenu[data-vue="cat"][data-col="2"] .section:nth-child(2n)::before,
#contenu[data-vue="cat"][data-col="3"] .section:not(:nth-child(3n+1))::before{
  content:"";position:absolute;top:2px;bottom:2px;left:-15px;
  width:1px;background:var(--border-strong);
}

.section{margin:0 0 22px;min-width:0}
.section-titre{
  display:flex;align-items:baseline;gap:8px;margin:0 0 12px;min-width:0;
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);
}
.section-n{
  font-size:11px;font-weight:400;color:var(--text-subtle);
  font-variant-numeric:tabular-nums;letter-spacing:0;flex:0 0 auto;
}

.grille{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--gouttiere);align-items:start;
}
/* Taille des vignettes par catégorie : dépend du nombre de colonnes de
   catégories choisi, pas d'une largeur minimale fixe. Une section pleine
   largeur (1 colonne) doit paraître aussi grande qu'en vue « Tout » ; à
   2 ou 3 colonnes, chaque section est plus étroite, donc moins de
   vignettes par rangée, en restant lisible. */
#contenu[data-vue="tout"] .grille,
#contenu[data-vue="cat"][data-col="1"] .grille{ grid-template-columns:repeat(2,minmax(0,1fr)); }
@media(min-width:640px){
  #contenu[data-vue="tout"] .grille,
  #contenu[data-vue="cat"][data-col="1"] .grille{ grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media(min-width:980px){
  :root{--gouttiere:18px}
  #contenu[data-vue="tout"] .grille,
  #contenu[data-vue="cat"][data-col="1"] .grille{ grid-template-columns:repeat(4,minmax(0,1fr)); }
}
@media(min-width:1300px){
  #contenu[data-vue="tout"] .grille,
  #contenu[data-vue="cat"][data-col="1"] .grille{ grid-template-columns:repeat(5,minmax(0,1fr)); }
}

/* Nombre de colonnes de produits fixé explicitement, pas déduit de la
   largeur (auto-fill) : le trait de séparation retire 27px aux sections
   qui ne sont pas en première position, donc auto-fill y calait moins
   de vignettes par rangée, plus grandes que chez leurs voisines. Un
   compte fixe garantit la même taille de vignette dans toutes les
   catégories, quelle que soit leur position. */
#contenu[data-vue="cat"][data-col="2"] .grille{ grid-template-columns:repeat(1,minmax(0,1fr)); }
@media(min-width:640px){ #contenu[data-vue="cat"][data-col="2"] .grille{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

#contenu[data-vue="cat"][data-col="3"] .grille{ grid-template-columns:repeat(2,minmax(0,1fr)); }

/* Carte pleine (fond + bordure) autour de la photo ET du texte ensemble,
   pas juste la photo : au défilement rapide, rien ne distinguait avant
   quel texte appartenait à quelle photo, les deux flottant sur le même
   fond greige de la page. */
.tuile{
  position:relative;min-width:0;
  animation:apparait .3s var(--ease) both;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-img);overflow:hidden;
}

/* La plaque : ratio fixe, donc la place est réservée avant que la
   photo n'arrive. Fond blanc parce que les boutiques shootent sur
   blanc, et contain pour ne jamais recadrer un meuble de travers. */
.tuile-media{
  aspect-ratio:4/5;background:var(--surface);border-radius:var(--r-img);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
}
@keyframes apparait{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tuile-lien{display:block;text-decoration:none;position:relative}
.tuile-img{
  /* max-width/max-height plutôt que width/height:100% + object-fit :
     centre et ne rogne jamais, y compris sur les photos très verticales
     (portrait, type 9:16), quel que soit le navigateur. */
  display:block;max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;padding:7px;box-sizing:border-box;
  transition:filter .25s var(--ease);
}
.tuile-lien:hover .tuile-img{filter:brightness(.94)}

/* Repli quand la photo manque ou refuse de se charger */
.tuile-vide{
  width:100%;height:100%;background:var(--surface);
  border:1px dashed var(--border-strong);border-radius:var(--r-img);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;
}
.tuile-vide span{font-size:12px;color:var(--text-subtle);letter-spacing:.06em;text-transform:uppercase}
.tuile-vide strong{font-size:13px;font-weight:500;color:var(--text-muted)}

.tuile-info{padding:8px 10px 10px}
.tuile-titre{
  font-size:13.5px;line-height:1.35;margin:0;font-weight:450;
  text-wrap:pretty;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tuile-meta{
  display:flex;align-items:center;gap:6px;margin-top:3px;
  font-size:12px;color:var(--text-subtle);
}
.tuile-prix{
  font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums;
  white-space:nowrap;flex:0 0 auto;      /* « 339 € » ne doit jamais se couper */
}
.tuile-sep{opacity:.4;flex:0 0 auto}
.tuile-boutique{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tuile-pieces{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tuile-piece{
  font-size:10.5px;padding:2px 7px;border-radius:var(--r-pill);
  border:1px solid var(--border-strong);color:var(--text-muted);
}
.tuile-qui{
  margin-left:auto;flex:0 0 auto;width:17px;height:17px;border-radius:50%;
  display:grid;place-items:center;font-size:9.5px;font-weight:600;
  background:var(--n-200);color:var(--text-muted);letter-spacing:0;
}

/* Menu de tuile */
.tuile-menu{
  position:absolute;top:9px;right:9px;
  width:28px;height:28px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);color:var(--n-900);
  display:grid;place-items:center;font-size:15px;line-height:1;
  box-shadow:0 1px 4px rgba(0,0,0,.16);
  opacity:0;transition:opacity .18s;
}
.tuile:hover .tuile-menu,.tuile-menu:focus-visible,.tuile-menu[data-ouvert]{opacity:1}
@media(hover:none){ .tuile-menu{opacity:.9} }

/* Croix de suppression, posée à gauche du menu « ··· » */
.tuile-suppr{
  position:absolute;top:9px;right:43px;
  width:28px;height:28px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);color:var(--danger);
  display:grid;place-items:center;font-size:14px;line-height:1;
  box-shadow:0 1px 4px rgba(0,0,0,.16);
  opacity:0;transition:opacity .18s,background .15s;
}
.tuile-suppr:hover{background:#FDEBE8}
.tuile:hover .tuile-suppr,.tuile-suppr:focus-visible{opacity:1}
@media(hover:none){ .tuile-suppr{opacity:.9} }

/* Réorganiser un article au sein de sa catégorie, en mode Gérer */
.tuile-reorg{display:flex;gap:2px;margin-top:5px}

.pop{
  position:absolute;top:38px;right:7px;z-index:12;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 8px 26px rgba(0,0,0,.14);padding:5px;min-width:172px;
  animation:apparait .14s var(--ease) both;
}
.pop button{
  display:block;width:100%;text-align:left;border:none;background:none;
  padding:8px 10px;border-radius:8px;font-size:13.5px;
}
.pop button:hover{background:var(--n-100)}
.pop hr{border:none;border-top:1px solid var(--border);margin:4px 2px}
.pop-titre{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-subtle);padding:6px 10px 3px;
}

/* ---------- État vide ---------- */
.vide{
  grid-column:1/-1;text-align:center;padding:70px 24px;max-width:420px;margin:0 auto;
}
.vide h2{font-size:17px;font-weight:600;margin:0 0 8px}
.vide p{color:var(--text-muted);font-size:14px;margin:0 0 20px;text-wrap:pretty}

/* ---------- Panneau (feuille mobile / dialogue bureau) ---------- */
.voile{
  position:fixed;inset:0;z-index:50;background:rgba(28,26,23,.32);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fondu .18s ease both;
  backdrop-filter:blur(2px);
}
@keyframes fondu{from{opacity:0}to{opacity:1}}
@media(min-width:640px){ .voile{align-items:center;padding:24px} }

.feuille{
  background:var(--bg);width:100%;max-width:440px;
  border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;
  animation:monte .26s var(--ease) both;
}
@keyframes monte{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:640px){
  .feuille{border-radius:16px;animation-name:apparait}
}
.feuille-tete{display:flex;align-items:center;margin-bottom:14px}
.feuille-tete h2{font-size:16px;font-weight:600;margin:0}
.feuille-tete .btn--fantome{margin-left:auto;font-size:20px;line-height:1;padding:2px 8px}

.apercu{
  display:flex;gap:12px;margin-bottom:16px;padding:10px;
  background:var(--surface);border-radius:12px;border:1px solid var(--border);
}
.apercu img{
  width:78px;height:78px;object-fit:contain;border-radius:8px;flex:0 0 auto;
  background:var(--n-50);
}
.apercu-vide{
  width:78px;height:78px;border-radius:8px;flex:0 0 auto;background:var(--n-100);
  border:1px dashed var(--border-strong);display:grid;place-items:center;
  font-size:10px;color:var(--text-subtle);text-align:center;padding:4px;
}
.apercu-txt{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px}
.apercu-txt b{font-size:13.5px;font-weight:500;line-height:1.3}
.apercu-txt small{font-size:12px;color:var(--text-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.champ{margin-bottom:13px}
.champ label{
  display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-subtle);margin-bottom:5px;font-weight:600;
}
.champ input{
  width:100%;padding:10px 12px;font-size:16px; /* 16px = pas de zoom auto iOS */
  border:1px solid var(--border-strong);border-radius:10px;
  background:var(--surface);color:var(--text);
}
.champ input:focus{outline:2px solid var(--n-900);outline-offset:-1px;border-color:transparent}

.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cats--grand{gap:8px;margin:2px 0 4px}
.cats--grand .puce{padding:11px 17px;font-size:15px;border-color:var(--border-strong)}
.cats--grand .puce:active{transform:scale(.96)}
.puce--autre{border-style:dashed;color:var(--text-subtle)}
.lien-details{
  display:inline-block;margin-top:14px;background:none;border:none;padding:4px 0;
  font-size:13px;color:var(--text-subtle);text-decoration:underline;text-underline-offset:3px;
}
.lien-details:hover{color:var(--text)}
.actions-feuille{display:flex;gap:8px;margin-top:18px}
.actions-feuille .btn{flex:1;justify-content:center;text-align:center;padding:11px}

.aide{font-size:12px;color:var(--text-subtle);line-height:1.5;text-wrap:pretty}

/* Gestion des catégories */
.cat-ligne{
  display:flex;align-items:center;gap:6px;padding:7px 4px 7px 10px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;
}
.cat-nom{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-nb{font-size:11.5px;color:var(--text-subtle);font-variant-numeric:tabular-nums;flex:0 0 auto}
.cat-act{
  flex:0 0 auto;border:none;background:none;padding:5px 7px;border-radius:7px;
  font-size:13px;color:var(--text-subtle);line-height:1;
}
.cat-act:hover{background:var(--n-100);color:var(--text)}
.cat-act:disabled{opacity:.25;cursor:default}
.cat-act--danger:hover{background:#F7E4E1;color:var(--danger)}
.aide code{
  background:var(--n-200);padding:1px 5px;border-radius:4px;font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.reorg-liste{list-style:none;margin:0;padding:0}
.reorg-ligne{cursor:default}
.reorg-poignee{
  flex:0 0 auto;font-size:16px;color:var(--text-subtle);cursor:grab;
  padding:2px 4px;line-height:1;touch-action:none;user-select:none;-webkit-user-select:none;
}
.reorg-drag{
  position:relative;z-index:5;background:var(--n-100);
  box-shadow:0 4px 14px rgba(0,0,0,.12);
}
.cat-nom-input{
  flex:1;min-width:0;font:inherit;font-size:14px;padding:3px 6px;
  border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);
}
.cat-nom-input:focus{border-color:var(--n-900);background:var(--surface);outline:none}
.signet-lien{
  display:inline-block;margin:8px 0;padding:9px 16px;border-radius:var(--r-pill);
  background:var(--primary);color:var(--on-primary);text-decoration:none;
  font-size:14px;font-weight:500;cursor:grab;
}

/* ---------- Bandeau d'état ---------- */
.toast{

<script>
/* Icône d'écran d'accueil iPhone : iOS n'accepte pas le SVG pour
   apple-touch-icon, on la dessine donc au chargement (même astuce que
   Suivi ventes Vinted). Reprend le motif de icon.svg. */
(function(){
  try{
    var T=180,c=document.createElement("canvas");c.width=c.height=T;
    var x=c.getContext("2d"),k=T/512;
    function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);
      x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill();}
    x.fillStyle="#1C1A17";rr(0,0,T,T,112*k);
    x.fillStyle="#EFEDE8";
    [[112,112,130,170],[270,112,130,106],[112,310,130,90],[270,246,130,154]]
      .forEach(function(t){rr(t[0]*k,t[1]*k,t[2]*k,t[3]*k,16*k)});
    var l=document.createElement("link");
    l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");
    document.head.appendChild(l);
  }catch(e){}
})();
</script>

<script>
(function(){
"use strict";

/* =================================================================
   1. CONFIGURATION
   Renseigne ces deux valeurs après avoir créé le projet Firebase.
   Tant qu'elles sont vides, l'app tourne en local sur cet appareil
   seulement (rien n'est partagé), ce qui permet de l'essayer tout
   de suite. Stockage : Firestore, via son API REST directe (pas le
   SDK), même principe que le reste de l'app. */
var FB_PROJECT = "fav-deco";   // ex: fav-deco-a1b2c
var FB_API_KEY = "AIzaSyB8vzKEN_U4xQqI2Bpu01eSWnWRdPKeH8c";   // clé API web (Project settings > General)

var COLLECTION = "favoris";
var CLE_LOCALE = "favdeco:items";
var CLE_QUI    = "favdeco:qui";
var CLE_VUE    = "favdeco:vue";
var CLE_ORDRE  = "favdeco:ordre";
var CLE_ORDRE_PIECES = "favdeco:ordre_pieces";
var CLE_COL    = "favdeco:col";

var partage = !!(FB_PROJECT && FB_API_KEY);
var FS_BASE = "https://firestore.googleapis.com/v1/projects/" + FB_PROJECT
            + "/databases/(default)/documents/" + COLLECTION;

/* Firestore REST encode chaque valeur avec son type
   ({stringValue:...}, {integerValue:...}, ...). Ces deux fonctions font
   l'aller-retour avec de simples objets JS, pour que le reste de l'app
   n'ait jamais à connaître ce format. valeurFirestore()/valeurJS() sont
   récursives pour supporter les arrayValue (champ `pieces`, multi-pièces
   par article), en plus des types scalaires déjà en place. */
function valeurFirestore(v){
  if (v === null || v === undefined) return { nullValue: null };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(valeurFirestore) } };
  if (typeof v === "boolean") return { booleanValue: v };
  if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  return { stringValue: String(v) };
}
function valeurJS(v){
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return parseInt(v.integerValue, 10);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(valeurJS);
  return null;
}
function versChampsFirestore(obj){
  var champs = {};
  Object.keys(obj).forEach(function(k){ champs[k] = valeurFirestore(obj[k]); });
  return champs;
}
function depuisChampsFirestore(champs){
  var obj = {};
  Object.keys(champs || {}).forEach(function(k){ obj[k] = valeurJS(champs[k]); });
  return obj;
}
function idDepuisNomFirestore(nom){ return nom.split("/").pop(); }

/* =================================================================
   2. ÉTAT
   ================================================================= */
var articles = [];
var filtre = null;          // null = tout (pièce)
var filtreCat = null;       // null = tout (type de meuble), combiné en ET avec filtre
var filtreMag = null;       // null = tout (boutique), combiné en ET avec filtre/filtreCat
var tri = null;              // null = plus récents d'abord (ou rang manuel en vue catégorie)
                              // "prix-asc" / "prix-desc" / "mag" sinon. Pas mémorisé (comme les filtres).
var vue = ["tout","piece","cat","mag"].indexOf(localStorage.getItem(CLE_VUE)) > -1
        ? localStorage.getItem(CLE_VUE) : "cat";
var colonnes = ["1","2","3"].indexOf(localStorage.getItem("favdeco:col")) > -1
             ? localStorage.getItem("favdeco:col") : "2";
var gestion = false;
var popOuvert = null;
var CATS_BASE = ["Canapé","Table","Chaise","Luminaire","Rangement","Lit","Déco","Tapis"];

var $ = function(s){ return document.querySelector(s); };
var contenu = $("#contenu"), zoneFiltres = $("#filtres"), zoneFiltresCat = $("#filtres-cat"), zoneFiltresMag = $("#filtres-mag"), zoneFiltresTri = $("#filtres-tri"), zoneCompte = $("#compte");

function echapper(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* `pieces` (les pièces de la maison, plusieurs par article) est un array,
   à la différence de `categorie` (le type de meuble, une seule valeur).
   Une fiche jamais réécrite depuis l'ajout du champ n'a pas cette clé en
   mémoire : ce garde-fou évite d'avoir à vérifier Array.isArray partout. */
function piecesDe(a){ return Array.isArray(a.pieces) ? a.pieces : []; }

/* Affichage des photos via wsrv.nl plutôt qu'en hotlink direct vers le
   site du vendeur : leur serveur n'est visité qu'une fois, wsrv.nl garde
   ensuite sa propre copie en cache (CDN Cloudflare) et la ressert à tous
   les viewers, y compris après un vidage de cache local. Vérifié le
   18/08/2026 : cf-cache-status passe à HIT dès le 2e appel.
   On ne stocke JAMAIS l'URL proxifiée : la base garde l'adresse réelle
   (utile pour l'édition, et pour ne pas dépendre d'un service tiers si
   on en change un jour), seul l'affichage passe par le proxy. */
function urlAffichage(u){
  if (!u) return u;
  if (/^data:|^blob:|^https?:\/\/wsrv\.nl\/|^https?:\/\/i0\.wp\.com\//.test(u)) return u;   // déjà local ou déjà proxifié
  return "https://wsrv.nl/?url=" + encodeURIComponent(u) + "&w=640&output=webp";
}

/* Second proxy, en repli seulement : certaines boutiques (IKEA, vérifié
   18/08/2026, bloqué de façon large et pas juste sur une image) renvoient
   403 à wsrv.nl. i0.wp.com (Jetpack Photon, WordPress/Automattic) passe
   là où wsrv.nl échoue, vérifié aussi sans régression sur Sklum. On le
   garde en repli plutôt qu'en principal : wsrv.nl est un service pensé
   pour ce rôle de proxy public, quand i0.wp.com est un service interne
   à l'écosystème WordPress détourné de son usage, moins sûr dans la
   durée. Toujours pas de hotlinking direct si les deux échouent. */
function urlAffichageRepli(u){
  var chemin = u.replace(/^https?:\/\//, "");
  return "https://i0.wp.com/" + chemin + (chemin.indexOf("?") > -1 ? "&" : "?") + "w=640";
}

/* Si la version proxifiée échoue, on retente une fois via le proxy de
   repli avant d'afficher « indisponible ». PAS de tentative en direct
   chez le vendeur au-delà des deux : ce serait exactement le hotlinking
   que ces proxys existent pour éviter. Certaines boutiques (Sklum, sur
   leur variante "-large_default") bloquent même le repli sur une image
   précise ; dans ce cas la photo manque. Le vrai correctif est de
   corriger l'URL stockée sur la fiche (voir « Modifier la fiche »), pas
   de hotlinker. */
function repliImage(img){
  if (!img.dataset.repli && img.dataset.original) {
    img.dataset.repli = "1";
    img.src = urlAffichageRepli(img.dataset.original);
    return;
  }
  videMedia(img);
}
function videMedia(img, texte){
  var zone = img.closest(".tuile-media, .apercu");
  var boutique = img.dataset.boutique || "";
  var html = zone && zone.classList.contains("apercu")
    ? '<div class="apercu-vide">Photo<br>indisponible</div>'
    : '<div class="tuile-vide"><span>' + (texte || "Photo indisponible") + '</span>'
      + (boutique ? '<strong>' + echapper(boutique) + '</strong>' : '') + '</div>';
  (zone || img.parentNode).innerHTML = html;
}
// Ce fichier est enfermé dans une IIFE : un attribut HTML inline
// (onerror="repliImage(this)") s'exécute dans le contexte global, donc
// invisible sans cet export explicite. Piège vécu le 18/08/2026 : la
// fonction existait, marchait au test direct, mais ne se déclenchait
// jamais depuis une vraie image cassée (ReferenceError silencieuse).
window.repliImage = repliImage;
/* action optionnelle : { libelle, fait() }, ajoute un bouton (ex. Annuler) */
function toast(msg, err, action){
  var t = document.createElement("div");
  t.className = "toast";
  if (err) t.setAttribute("data-err","");
  var texte = document.createElement("span");
  texte.textContent = msg;
  t.appendChild(texte);
  if (action){
    var b = document.createElement("button");
    b.type = "button"; b.className = "toast-action"; b.textContent = action.libelle;
    b.addEventListener("click", function(){ t.remove(); action.fait(); });
    t.appendChild(b);
  }
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, action ? 5000 : (err ? 4200 : 2100));
}
function qui(){ return localStorage.getItem(CLE_QUI) || ""; }

/* =================================================================
   3. STOCKAGE  (Firestore REST, ou localStorage si non configuré)
   ================================================================= */
function lireLocal(){
  try { return JSON.parse(localStorage.getItem(CLE_LOCALE) || "[]"); }
  catch(e){ return []; }
}
function ecrireLocal(a){ localStorage.setItem(CLE_LOCALE, JSON.stringify(a)); }

function charger(){
  if (!partage) {
    articles = lireLocal().filter(function(a){ return !a.supprime; });
    rendre();
    return migrerPieces();
  }
  // Pas de "WHERE" ni de "ORDER BY" simple dans l'API REST Firestore :
  // on charge la collection (une liste perso reste petite) et on filtre/
  // trie côté client, comme le reste de l'app le fait déjà pour les
  // catégories.
  return fetch(FS_BASE + "?pageSize=1000&key=" + FB_API_KEY)
    .then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data){
      var docs = (data.documents || []).map(function(d){
        var o = depuisChampsFirestore(d.fields);
        o.id = idDepuisNomFirestore(d.name);
        return o;
      }).filter(function(a){ return !a.supprime; })
        .sort(function(a, b){ return String(b.cree_le || "").localeCompare(String(a.cree_le || "")); });

      // Garde-fou repris de vinted-search : ne jamais remplacer un
      // affichage rempli par une réponse vide (incident du 01/07/2026).
      if (!docs.length && articles.length) {
        console.warn("Réponse vide ignorée, l'affichage est conservé.");
        return;
      }
      articles = docs;
      rendre();
      return migrerPieces();
    })
    .catch(function(e){
      console.error(e);
      if (!articles.length) toast("Connexion impossible : " + e.message, true);
    });
}

function ajouter(obj){
  obj.cree_le = new Date().toISOString();
  obj.supprime = false;
  // Si la catégorie a déjà un ordre manuel (rang posé via "Réorganiser les
  // articles"), un article sans rang atterrit après tous les autres quel
  // que soit son ordre d'ajout : on lui donne un rang inférieur au plus
  // petit existant pour qu'il apparaisse en tête. Sans rang existant dans
  // la catégorie, on ne touche à rien : l'ordre d'ajout (le plus récent en
  // premier) s'applique déjà tel quel.
  var cat = obj.categorie || SANS_CAT;
  var rangs = articles.filter(function(a){
    return (a.categorie || SANS_CAT) === cat && a.rang != null;
  }).map(function(a){ return a.rang; });
  if (rangs.length) obj.rang = Math.min.apply(null, rangs) - 10;
  if (!partage) {
    obj.id = Date.now();
    articles.unshift(obj); ecrireLocal(articles); rendre();
    return Promise.resolve();
  }
  return fetch(FS_BASE + "?key=" + FB_API_KEY, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fields: versChampsFirestore(obj) })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(t || ("HTTP " + r.status)); });
    return r.json();
  }).then(function(doc){
    var nouveau = depuisChampsFirestore(doc.fields);
    nouveau.id = idDepuisNomFirestore(doc.name);
    articles.unshift(nouveau);
    rendre();
  });
}

function modifier(id, patch){
  var i = articles.findIndex(function(a){ return String(a.id) === String(id); });
  if (i > -1) Object.assign(articles[i], patch);
  if (patch.supprime && i > -1) articles.splice(i, 1);
  rendre();
  if (!partage) {
    var tout = lireLocal(), j = tout.findIndex(function(a){ return String(a.id) === String(id); });
    if (j > -1) { Object.assign(tout[j], patch); ecrireLocal(tout); }
    return Promise.resolve();
  }
  return fetch(urlDocFirestore(id, Object.keys(patch)), {
    method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fields: versChampsFirestore(patch) })
  }).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); })
    .catch(function(e){ toast("Modification non enregistrée : " + e.message, true); charger(); });
}

/* Une PATCH Firestore sans updateMask REMPLACE le document entier (elle
   effacerait tous les champs absents du patch) : chaque champ modifié
   doit être listé explicitement, piège vérifié avant mise en prod. */
function urlDocFirestore(id, champs){
  var params = new URLSearchParams();
  params.set("key", FB_API_KEY);
  champs.forEach(function(c){ params.append("updateMask.fieldPaths", c); });
  return FS_BASE + "/" + id + "?" + params.toString();
}

/* Renomme une catégorie partout. nouveau = null vide la catégorie,
   les meubles retombent dans « Sans catégorie » et ne sont jamais perdus. */
function majCategorie(ancien, nouveau){
  var concernes = articles.filter(function(a){ return a.categorie === ancien; }).map(function(a){ return a.id; });
  articles.forEach(function(a){ if (a.categorie === ancien) a.categorie = nouveau; });
  var o = ordre(), i = o.indexOf(ancien);
  if (i > -1){ if (nouveau) o[i] = nouveau; else o.splice(i, 1); poserOrdre(o); }
  if (filtre === ancien) filtre = nouveau;
  rendre();

  if (!partage){
    var tout = lireLocal();
    tout.forEach(function(a){ if (a.categorie === ancien) a.categorie = nouveau; });
    ecrireLocal(tout);
    return Promise.resolve();
  }
  // Pas de "PATCH WHERE" en Firestore : un appel par article concerné,
  // même technique que deplacerArticle() pour le rang.
  return Promise.all(concernes.map(function(id){
    return fetch(urlDocFirestore(id, ["categorie"]), {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: versChampsFirestore({ categorie: nouveau }) })
    });
  })).then(function(reponses){
    var echec = reponses.find(function(r){ return !r.ok; });
    if (echec) throw new Error("HTTP " + echec.status);
  }).catch(function(e){ toast("Non enregistré : " + e.message, true); charger(); });
}

/* Renomme ou supprime une pièce dans le tableau `pieces` de chaque article
   concerné. Contrairement à majCategorie() (qui écrase une valeur scalaire
   identique pour tous), ici chaque article garde ses AUTRES pièces intactes :
   on mute le tableau de chacun individuellement. nouveau = null retire
   juste cette entrée (l'article reste rattaché à ses éventuelles autres
   pièces, ou tombe en « Sans pièce » si le tableau devient vide) — à la
   différence de majCategorie(nom, null) qui vide tout le champ. */
function majPiece(ancien, nouveau){
  var concernes = articles.filter(function(a){ return piecesDe(a).indexOf(ancien) > -1; });
  concernes.forEach(function(a){
    if (nouveau){
      a.pieces = a.pieces.map(function(p){ return p === ancien ? nouveau : p; });
      a.pieces = a.pieces.filter(function(p, i){ return a.pieces.indexOf(p) === i; }); // dédoublonne si fusion
    } else {
      a.pieces = a.pieces.filter(function(p){ return p !== ancien; });
    }
  });
  var o = ordrePieces(), i = o.indexOf(ancien);
  if (i > -1){ if (nouveau) o[i] = nouveau; else o.splice(i, 1); poserOrdrePieces(o); }
  if (filtre === ancien) filtre = nouveau;
  rendre();

  if (!partage){
    var tout = lireLocal();
    concernes.forEach(function(a){
      var j = tout.findIndex(function(x){ return String(x.id) === String(a.id); });
      if (j > -1) tout[j].pieces = a.pieces;
    });
    ecrireLocal(tout);
    return Promise.resolve();
  }
  return Promise.all(concernes.map(function(a){
    return fetch(urlDocFirestore(a.id, ["pieces"]), {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: versChampsFirestore({ pieces: a.pieces }) })
    });
  })).then(function(reponses){
    var echec = reponses.find(function(r){ return !r.ok; });
    if (echec) throw new Error("HTTP " + echec.status);
  }).catch(function(e){ toast("Non enregistré : " + e.message, true); charger(); });
}

/* Migration ponctuelle : `categorie` servait jusqu'ici à noter la pièce
   (Chambre/Salon/Bureau). On bascule cette valeur vers `pieces` (array) et
   on vide `categorie` pour qu'il retrouve son usage prévu (le type de
   meuble). Un article est « à migrer » si categorie est renseigné ET qu'il
   n'a pas encore de pieces : une fois migré, categorie passe à null, donc
   il ne sera plus jamais candidat — idempotent sans drapeau dédié. Les deux
   champs partent dans le MÊME PATCH par article (même updateMask), jamais
   de fiche à moitié migrée. En cas d'échec réseau partiel : un seul toast
   agrégé, pas de rappel de charger() en boucle ; les fiches en échec
   restent candidates au prochain rechargement naturel de la page. */
function migrerPieces(){
  var candidats = articles.filter(function(a){
    return a.categorie != null && a.categorie !== "" && !Array.isArray(a.pieces);
  });
  if (!candidats.length) return Promise.resolve();

  candidats.forEach(function(a){ a.pieces = [a.categorie]; a.categorie = null; });
  rendre();

  if (!partage){
    var tout = lireLocal();
    candidats.forEach(function(a){
      var j = tout.findIndex(function(x){ return String(x.id) === String(a.id); });
      if (j > -1){ tout[j].pieces = a.pieces; tout[j].categorie = null; }
    });
    ecrireLocal(tout);
    return Promise.resolve();
  }

  return Promise.all(candidats.map(function(a){
    return fetch(urlDocFirestore(a.id, ["pieces","categorie"]), {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: versChampsFirestore({ pieces: a.pieces, categorie: null }) })
    }).then(function(r){ return { id:a.id, ok:r.ok }; });
  })).then(function(resultats){
    var echecs = resultats.filter(function(r){ return !r.ok; });
    if (echecs.length) toast(echecs.length + " fiche(s) pas encore migrée(s), on réessaiera plus tard", true);
  }).catch(function(e){ console.error("Migration pieces:", e); });
}

/* Ordre des articles À L'INTÉRIEUR d'une catégorie : champ `rang`, partagé
   (Firestore), à la différence de l'ordre des catégories qui reste local à
   chaque appareil. Sans rang (valeur par défaut), l'ordre reste celui de
   l'ajout, le plus récent en premier. */
function triCategorie(liste){
  return liste.slice().sort(function(x, y){
    var rx = x.rang, ry = y.rang;
    if (rx != null && ry != null) return rx - ry;
    if (rx != null) return -1;
    if (ry != null) return 1;
    return 0;   // tri stable : garde l'ordre déjà affiché
  });
}

function deplacerArticle(id, delta){
  var a = articles.find(function(x){ return String(x.id) === String(id); });
  if (!a) return;
  var cat = a.categorie || SANS_CAT;
  var freres = triCategorie(articles.filter(function(x){ return (x.categorie || SANS_CAT) === cat; }));
  var i = freres.findIndex(function(x){ return String(x.id) === String(id); });
  var j = i + delta;
  if (i < 0 || j < 0 || j >= freres.length) return;
  freres.splice(j, 0, freres.splice(i, 1)[0]);
  freres.forEach(function(x, idx){
    var nv = (idx + 1) * 10;
    if (x.rang !== nv) modifier(x.id, { rang: nv });
  });
}

/* Suppression douce avec un court délai d'annulation : la croix est
   accessible en un clic, contrairement à l'ancien « Retirer » planqué
   dans le menu, donc elle mérite un filet de sécurité. */
function supprimerArticle(id){
  var i = articles.findIndex(function(x){ return String(x.id) === String(id); });
  if (i < 0) return;
  var copie = Object.assign({}, articles[i]), pos = i;
  modifier(id, { supprime:true });
  toast("Retiré", false, {
    libelle: "Annuler",
    fait: function(){
      articles.splice(Math.min(pos, articles.length), 0, copie);
      rendre();
      if (!partage){
        var tout = lireLocal(), j = tout.findIndex(function(x){ return String(x.id) === String(id); });
        if (j > -1){ tout[j].supprime = false; ecrireLocal(tout); }
        return;
      }
      fetch(urlDocFirestore(id, ["supprime"]), {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fields: versChampsFirestore({ supprime:false }) })
      }).catch(function(e){ toast("Annulation non enregistrée : " + e.message, true); });
    }
  });
}

/* =================================================================
   4. RENDU
   ================================================================= */
function ordre(){
  try { return JSON.parse(localStorage.getItem(CLE_ORDRE) || "[]"); } catch(e){ return []; }
}
function poserOrdre(liste){ localStorage.setItem(CLE_ORDRE, JSON.stringify(liste)); }

/* Ordre d'affichage des pièces : même principe que ordre()/poserOrdre(),
   mais sur une clé localStorage SÉPARÉE. La réutiliser aurait cassé l'ordre
   des types dès le premier glisser-déposer d'une pièce, poserOrdre()
   remplaçant tout le contenu de la clé. */
function ordrePieces(){
  try { return JSON.parse(localStorage.getItem(CLE_ORDRE_PIECES) || "[]"); } catch(e){ return []; }
}
function poserOrdrePieces(liste){ localStorage.setItem(CLE_ORDRE_PIECES, JSON.stringify(liste)); }

/* Les catégories rangées à la main passent devant, dans l'ordre choisi.
   Les nouvelles arrivent ensuite, par ordre alphabétique. */
function categories(){
  var vues = {};
  articles.forEach(function(a){ if (a.categorie) vues[a.categorie] = (vues[a.categorie] || 0) + 1; });
  var o = ordre();
  return Object.keys(vues).sort(function(x, y){
    var ix = o.indexOf(x), iy = o.indexOf(y);
    if (ix > -1 && iy > -1) return ix - iy;
    if (ix > -1) return -1;
    if (iy > -1) return 1;
    return x.localeCompare(y, "fr");
  }).map(function(c){ return { nom:c, n:vues[c] }; });
}

/* Même principe que categories(), mais sur le champ `pieces` (array) :
   chaque article compte dans toutes ses pièces, pas une seule. */
function pieces(){
  var vues = {};
  articles.forEach(function(a){ piecesDe(a).forEach(function(p){ vues[p] = (vues[p] || 0) + 1; }); });
  var o = ordrePieces();
  return Object.keys(vues).sort(function(x, y){
    var ix = o.indexOf(x), iy = o.indexOf(y);
    if (ix > -1 && iy > -1) return ix - iy;
    if (ix > -1) return -1;
    if (iy > -1) return 1;
    return x.localeCompare(y, "fr");
  }).map(function(p){ return { nom:p, n:vues[p] }; });
}

/* Pas de rangement manuel pour les boutiques (contrairement à
   categories()/pieces()) : le nom vient directement du domaine à
   l'extraction, tri simplement alphabétique. */
function boutiques(){
  var vues = {};
  articles.forEach(function(a){ if (a.boutique) vues[a.boutique] = (vues[a.boutique] || 0) + 1; });
  return Object.keys(vues).sort(function(x, y){ return x.localeCompare(y, "fr"); })
    .map(function(b){ return { nom:b, n:vues[b] }; });
}

/* Trois lignes de filtres, indépendantes et combinées en ET : pièces
   (chambre/salon/bureau...), types de meuble (tapis/canapé/cadre...) et
   boutique. Un article peut avoir plusieurs pièces, donc la ligne pièces
   reste single-select comme avant (un clic = une pièce à la fois) ; les
   lignes type et boutique le sont aussi, un article n'ayant qu'un seul
   type et une seule boutique. Chaque ligne se cache d'elle-même si son axe
   est encore vide (.barre:has(.filtres:empty) dans le CSS). */
function rendreFiltres(){
  var pcs = pieces();
  var sansPieceN = articles.filter(function(a){ return piecesDe(a).length === 0; }).length;
  var h = '<button class="puce" data-piece="" aria-pressed="' + (filtre === null) + '">Toutes'
        + (articles.length ? ' <span class="n">' + articles.length + '</span>' : '') + '</button>';
  if (sansPieceN){
    h += '<button class="puce" data-piece="' + echapper(SANS_PIECE) + '" aria-pressed="'
      + (filtre === false) + '">' + SANS_PIECE + ' <span class="n">' + sansPieceN + '</span></button>';
  }
  pcs.forEach(function(p){
    h += '<button class="puce" data-piece="' + echapper(p.nom) + '" aria-pressed="'
      + (filtre === p.nom) + '">' + echapper(p.nom) + ' <span class="n">' + p.n + '</span></button>';
  });
  zoneFiltres.innerHTML = (pcs.length || sansPieceN) ? h : "";

  var cats = categories();
  var sansCatN = articles.filter(function(a){ return !a.categorie; }).length;
  var hc = '<button class="puce" data-cat="" aria-pressed="' + (filtreCat === null) + '">Tous types'
        + (articles.length ? ' <span class="n">' + articles.length + '</span>' : '') + '</button>';
  if (sansCatN){
    hc += '<button class="puce" data-cat="' + echapper(SANS_CAT) + '" aria-pressed="'
      + (filtreCat === false) + '">' + SANS_CAT + ' <span class="n">' + sansCatN + '</span></button>';
  }
  cats.forEach(function(c){
    hc += '<button class="puce" data-cat="' + echapper(c.nom) + '" aria-pressed="'
      + (filtreCat === c.nom) + '">' + echapper(c.nom) + ' <span class="n">' + c.n + '</span></button>';
  });
  zoneFiltresCat.innerHTML = (cats.length || sansCatN) ? hc : "";

  // Trop de boutiques différentes pour des pastilles (une ligne devient
  // vite illisible) : menu déroulant natif plutôt qu'une rangée de puces.
  var mags = boutiques();
  var sansMagN = articles.filter(function(a){ return !a.boutique; }).length;
  var hm = '<select class="select-mag" aria-label="Filtrer par magasin">'
        + '<option value=""' + (filtreMag === null ? ' selected' : '') + '>Tous'
        + (articles.length ? ' (' + articles.length + ')' : '') + '</option>';
  if (sansMagN){
    hm += '<option value="' + echapper(SANS_BOUTIQUE) + '"' + (filtreMag === false ? ' selected' : '') + '>'
      + SANS_BOUTIQUE + ' (' + sansMagN + ')</option>';
  }
  mags.forEach(function(b){
    hm += '<option value="' + echapper(b.nom) + '"' + (filtreMag === b.nom ? ' selected' : '') + '>'
      + echapper(b.nom) + ' (' + b.n + ')</option>';
  });
  hm += '</select>';
  zoneFiltresMag.innerHTML = (mags.length || sansMagN) ? hm : "";

  // Pas un filtre (rien n'est exclu) : un ordre à appliquer à l'intérieur
  // de chaque section, dans toutes les vues. Voir appliquerTri().
  var ht = '<select class="select-mag" aria-label="Trier par">'
        + '<option value=""' + (tri === null ? ' selected' : '') + '>Plus récents d\'abord</option>'
        + '<option value="prix-asc"' + (tri === "prix-asc" ? ' selected' : '') + '>Prix croissant</option>'
        + '<option value="prix-desc"' + (tri === "prix-desc" ? ' selected' : '') + '>Prix décroissant</option>'
        + '<option value="mag"' + (tri === "mag" ? ' selected' : '') + '>Magasin (A→Z)</option>'
        + '</select>';
  zoneFiltresTri.innerHTML = articles.length ? ht : "";
}

/* Tri appliqué à l'intérieur de chaque section (pas un filtre, rien n'est
   exclu). Sans tri actif (défaut), on ne touche à rien : l'appelant garde
   l'ordre déjà en place (le plus récent d'abord, ou le rang manuel en vue
   « Par catégorie »). Les articles sans prix passent toujours en fin de
   liste sur les deux tris prix plutôt que de sauter n'importe où. */
function appliquerTri(liste){
  if (tri === "prix-asc" || tri === "prix-desc"){
    var sens = tri === "prix-asc" ? 1 : -1;
    return liste.slice().sort(function(x, y){
      var px = x.prix, py = y.prix;
      if (px == null && py == null) return 0;
      if (px == null) return 1;
      if (py == null) return -1;
      return (px - py) * sens;
    });
  }
  if (tri === "mag"){
    return liste.slice().sort(function(x, y){
      var bx = x.boutique || "", by = y.boutique || "";
      if (!bx && !by) return 0;
      if (!bx) return 1;
      if (!by) return -1;
      return bx.localeCompare(by, "fr");
    });
  }
  return liste;
}

function tuileHTML(a, ctx){
  ctx = ctx || {};
  var img = a.image_url
    ? '<img class="tuile-img" src="' + echapper(urlAffichage(a.image_url)) + '" data-original="' + echapper(a.image_url) + '" data-boutique="' + echapper(a.boutique || "") + '" alt="' + echapper(a.titre || "") + '"'
      + ' loading="lazy" referrerpolicy="no-referrer" onerror="repliImage(this)">'
    : '<div class="tuile-vide"><span>Sans photo</span><strong>' + echapper(a.boutique || "") + '</strong></div>';

  var prix = (a.prix != null && a.prix !== "")
    ? '<span class="tuile-prix">' + Number(a.prix).toLocaleString("fr-FR", {maximumFractionDigits:0}) + ' €</span><span class="tuile-sep">·</span>'
    : "";

  var init = a.ajoute_par ? '<span class="tuile-qui" title="Ajouté par ' + echapper(a.ajoute_par) + '">'
    + echapper(a.ajoute_par.trim().charAt(0).toUpperCase()) + '</span>' : "";

  var pcs = piecesDe(a);
  var badgesPieces = pcs.length
    ? '<div class="tuile-pieces">' + pcs.map(function(p){ return '<span class="tuile-piece">' + echapper(p) + '</span>'; }).join("") + '</div>'
    : "";

  var reorg = "";
  if (gestion && ctx.dansListe){
    reorg = '<div class="tuile-reorg">'
      + '<button class="cat-act" data-art-monter="' + echapper(a.id) + '"' + (ctx.premier ? ' disabled' : '') + ' aria-label="Monter dans la catégorie">↑</button>'
      + '<button class="cat-act" data-art-descendre="' + echapper(a.id) + '"' + (ctx.dernier ? ' disabled' : '') + ' aria-label="Descendre dans la catégorie">↓</button>'
      + '</div>';
  }

  return '<article class="tuile" data-id="' + echapper(a.id) + '">'
    + '<a class="tuile-lien" href="' + echapper(a.url) + '" target="_blank" rel="noopener noreferrer">'
    +   '<div class="tuile-media">' + img + '</div></a>'
    + '<button class="tuile-menu" data-menu="' + echapper(a.id) + '" aria-label="Options">···</button>'
    + '<button class="tuile-suppr" data-suppr="' + echapper(a.id) + '" aria-label="Retirer">✕</button>'
    + '<div class="tuile-info">'
    +   '<p class="tuile-titre">' + echapper(a.titre || a.url) + '</p>'
    +   '<div class="tuile-meta">' + prix
    +     '<span class="tuile-boutique">' + echapper(a.boutique || "") + '</span>' + init
    +   '</div>' + badgesPieces + reorg
    + '</div></article>';
}

var SANS_CAT = "Sans catégorie";
var SANS_PIECE = "Sans pièce";
var SANS_BOUTIQUE = "Sans boutique";

function rendre(){
  rendreFiltres();
  zoneCompte.textContent = articles.length ? articles.length + (articles.length > 1 ? " trouvailles" : " trouvaille") : "";

  if (!articles.length){
    contenu.innerHTML = '<div class="vide">'
      + '<h2>Rien pour l\'instant</h2>'
      + '<p>Ajoute un premier meuble en collant son lien, ou installe le signet pour l\'attraper en un clic depuis la boutique.</p>'
      + '<button class="btn btn--primaire" data-action="ajouter">Coller un lien</button>'
      + '<p class="aide" style="margin-top:18px">La plupart des boutiques bloquent la lecture automatique d\'un lien collé. Pour tout récupérer en un clic, installe le signet depuis <b>Commencer à utiliser l\'app</b>.</p>'
      + '</div>';
    return;
  }

  // L'attribut CSS data-vue traite "piece" et "mag" comme "cat" : mise en
  // page en sections/colonnes identique, seule la clé de groupement diffère
  // (gérée plus bas en JS). Évite de dupliquer toutes les règles CSS de grille.
  contenu.setAttribute("data-vue", (vue === "piece" || vue === "mag") ? "cat" : vue);
  contenu.setAttribute("data-col", colonnes);
  majCommandes();

  // filtre/filtreCat/filtreMag valent : null (tout), false (« sans »), ou un nom précis.
  var liste = articles.filter(function(a){
    var okPiece = filtre === null ? true : filtre === false ? piecesDe(a).length === 0 : piecesDe(a).indexOf(filtre) > -1;
    var okCat = filtreCat === null ? true : filtreCat === false ? !a.categorie : a.categorie === filtreCat;
    var okMag = filtreMag === null ? true : filtreMag === false ? !a.boutique : a.boutique === filtreMag;
    return okPiece && okCat && okMag;
  });

  if (!liste.length){
    var libPiece = filtre === false ? SANS_PIECE : filtre;
    var libCat = filtreCat === false ? SANS_CAT : filtreCat;
    var libMag = filtreMag === false ? SANS_BOUTIQUE : filtreMag;
    var nomFiltre = [libPiece, libCat, libMag].filter(Boolean).join(" · ");
    contenu.innerHTML = '<div class="vide"><h2>Rien dans « ' + echapper(nomFiltre) + ' »</h2>'
      + '<p>Rien ne correspond à ce filtre pour le moment.</p></div>';
    return;
  }

  // Vue « Tout » : une seule grille, sans titres de section, pas de
  // réorganisation (elle n'a de sens qu'à l'intérieur d'une catégorie)
  if (vue === "tout"){
    contenu.innerHTML = '<div class="grille">' + appliquerTri(liste).map(function(a){ return tuileHTML(a); }).join("") + '</div>';
    return;
  }

  // Vue « Par pièce » : une section par pièce. Un article à plusieurs
  // pièces apparaît dans chacune de ses sections (intentionnel, cf. tag
  // multi-pièces) — SAUF si un filtre pièce précis est actif : `liste` est
  // déjà restreinte à cette seule pièce, donc l'article ne doit se ranger
  // que dans SA section, pas fan-out sur ses autres pièces (bug vécu :
  // un miroir à 3 pièces apparaissait dans les 3 sections même en
  // filtrant sur une seule). Pas de flèches de réorganisation ici : le
  // champ `rang` est scopé au type (categorie), pas à la pièce, donc pas
  // de tri significatif à proposer dans cette vue (ordre = le plus
  // récent d'abord, comme la vue « Tout »).
  if (vue === "piece"){
    var groupesP = {};
    liste.forEach(function(a){
      var pcs = piecesDe(a);
      if (!pcs.length) { (groupesP[SANS_PIECE] = groupesP[SANS_PIECE] || []).push(a); }
      else pcs.forEach(function(p){
        if (filtre !== null && filtre !== false && p !== filtre) return;
        (groupesP[p] = groupesP[p] || []).push(a);
      });
    });
    var rangP = pieces().map(function(p){ return p.nom; });
    var nomsP = Object.keys(groupesP).sort(function(x, y){
      if (x === SANS_PIECE) return 1;
      if (y === SANS_PIECE) return -1;
      return rangP.indexOf(x) - rangP.indexOf(y);
    });
    contenu.innerHTML = nomsP.map(function(n){
      var titre = '<h2 class="section-titre">' + echapper(n)
        + '<span class="section-n">' + groupesP[n].length + '</span></h2>';
      return '<section class="section">' + titre
        + '<div class="grille">' + appliquerTri(groupesP[n]).map(function(a){ return tuileHTML(a); }).join("") + '</div>'
        + '</section>';
    }).join("");
    return;
  }

  // Vue « Par magasin » : une section par boutique (champ `boutique`,
  // rempli automatiquement à l'extraction). Pas de liste à gérer à la
  // main comme pour pièces/catégories : les sections sont déduites des
  // fiches existantes, triées alphabétiquement (Sans boutique en dernier).
  // Pas de réorganisation ici, `rang` reste scopé à la catégorie.
  if (vue === "mag"){
    var groupesM = {};
    liste.forEach(function(a){
      var b = a.boutique || SANS_BOUTIQUE;
      (groupesM[b] = groupesM[b] || []).push(a);
    });
    var nomsM = Object.keys(groupesM).sort(function(x, y){
      if (x === SANS_BOUTIQUE) return 1;
      if (y === SANS_BOUTIQUE) return -1;
      return x.localeCompare(y, "fr");
    });
    contenu.innerHTML = nomsM.map(function(n){
      var titre = '<h2 class="section-titre">' + echapper(n)
        + '<span class="section-n">' + groupesM[n].length + '</span></h2>';
      return '<section class="section">' + titre
        + '<div class="grille">' + appliquerTri(groupesM[n]).map(function(a){ return tuileHTML(a); }).join("") + '</div>'
        + '</section>';
    }).join("");
    return;
  }

  // Vue « Par catégorie » : une section par type de meuble
  var groupes = {};
  liste.forEach(function(a){
    var c = a.categorie || SANS_CAT;
    (groupes[c] = groupes[c] || []).push(a);
  });

  var rang = categories().map(function(c){ return c.nom; });
  var noms = Object.keys(groupes).sort(function(x, y){
    if (x === SANS_CAT) return 1;          // toujours en dernier
    if (y === SANS_CAT) return -1;
    return rang.indexOf(x) - rang.indexOf(y);
  });

  contenu.innerHTML = noms.map(function(n){
    // Renommer/supprimer une catégorie se fait depuis la fenêtre « Gérer les
    // catégories » (bouton dédié), plus sur les titres de section ici.
    var titre = '<h2 class="section-titre">' + echapper(n)
      + '<span class="section-n">' + groupes[n].length + '</span></h2>';
    // Un tri actif (prix/magasin) prend le pas sur le rang manuel pour
    // l'affichage, sans y toucher : les flèches ↑↓ n'auraient plus d'effet
    // visible tant qu'un tri est actif, donc on les masque (ctx vide) au
    // lieu de laisser croire qu'elles réorganisent quelque chose.
    var membres = tri ? appliquerTri(groupes[n]) : triCategorie(groupes[n]);
    return '<section class="section">' + titre
      + '<div class="grille">' + membres.map(function(a, i){
          return tuileHTML(a, tri ? {} : { dansListe:true, premier: i === 0, dernier: i === membres.length - 1 });
        }).join("") + '</div>'
      + '</section>';
  }).join("");
}

/* =================================================================
   5. MENU DE TUILE
   ================================================================= */
function fermerPop(){ if (popOuvert) { popOuvert.remove(); popOuvert = null; } }

/* Réduit à « Modifier la fiche » : le changement de catégorie se fait
   désormais depuis cette fiche (elle a déjà les pastilles), et retirer un
   article a sa propre croix directement sur la vignette. */
function ouvrirPop(id, bouton){
  fermerPop();
  var a = articles.find(function(x){ return String(x.id) === String(id); });
  if (!a) return;

  var pop = document.createElement("div");
  pop.className = "pop";
  pop.innerHTML = '<button data-modifier="1">Modifier la fiche</button>';

  bouton.parentNode.appendChild(pop);
  bouton.setAttribute("data-ouvert","");
  popOuvert = pop;

  pop.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.modifier) ouvrirAjout(a, a.id);
    fermerPop();
  });
}

document.addEventListener("click", function(e){
  var m = e.target.closest("[data-menu]");
  if (m) { e.preventDefault(); ouvrirPop(m.dataset.menu, m); return; }
  var s = e.target.closest("[data-suppr]");
  if (s) { e.preventDefault(); supprimerArticle(s.dataset.suppr); return; }
  if (!e.target.closest(".pop")) fermerPop();

  // Scopés à leur zone précise : "data-piece" existe aussi sur les
  // pastilles du panneau d'ajout/édition (#f-pieces), qui ont leur propre
  // écouteur — sans ce scope, un clic là-bas changerait aussi ce filtre.
  // filtre/filtreCat : null (pastille "Toutes"/"Tous types"), false (pastille
  // "Sans pièce"/"Sans catégorie"), ou le nom précis cliqué.
  var p = e.target.closest("#filtres [data-piece]");
  if (p) {
    var vp = p.dataset.piece;
    filtre = vp === "" ? null : vp === SANS_PIECE ? false : vp;
    rendre();
    window.scrollTo({ top:0, behavior:"smooth" });
  }
  var pc = e.target.closest("#filtres-cat [data-cat]");
  if (pc) {
    var vc = pc.dataset.cat;
    filtreCat = vc === "" ? null : vc === SANS_CAT ? false : vc;
    rendre();
    window.scrollTo({ top:0, behavior:"smooth" });
  }
  if (e.target.closest('[data-action="ajouter"]')) ouvrirAjout(null);
});

// Filtre magasin et tri : menus déroulants natifs (voir rendreFiltres),
// pas de clic à intercepter ici, un "change" suffit.

/* =================================================================
   6. EXTRACTION DES DONNÉES PRODUIT
   Même logique que le signet. Ordre : JSON-LD (le plus fiable en
   e-commerce), puis OpenGraph, puis repli.
   ================================================================= */
function extraireDepuisDoc(doc, href){
  var out = { url: href, titre:"", image_url:"", prix:null, boutique:"" };
  try { out.boutique = new URL(href).hostname.replace(/^www\./, ""); } catch(e){}

  // 6a. JSON-LD Product
  var blocs = doc.querySelectorAll('script[type="application/ld+json"]');
  for (var i = 0; i < blocs.length && !out.titre; i++){
    try {
      var j = JSON.parse(blocs[i].textContent);
      var pile = Array.isArray(j) ? j.slice() : [j];
      while (pile.length){
        var n = pile.shift();
        if (!n || typeof n !== "object") continue;
        if (n["@graph"]) { pile = pile.concat(n["@graph"]); continue; }
        var t = n["@type"];
        var estProduit = t === "Product" || (Array.isArray(t) && t.indexOf("Product") > -1);
        if (!estProduit) continue;
        out.titre = n.name || "";
        var im = n.image;
        if (Array.isArray(im)) im = im[0];
        if (im && typeof im === "object") im = im.url || im.contentUrl;
        if (im) out.image_url = im;
        var of = n.offers; if (Array.isArray(of)) of = of[0];
        if (of && of.price != null) out.prix = parseFloat(String(of.price).replace(",", "."));
        break;
      }
    } catch(e){}
  }

  // 6b. OpenGraph
  function meta(){
    for (var k = 0; k < arguments.length; k++){
      var el = doc.querySelector('meta[property="' + arguments[k] + '"], meta[name="' + arguments[k] + '"]');
      if (el && el.content) return el.content;
    }
    return "";
  }
  if (!out.titre)     out.titre     = meta("og:title","twitter:title") || doc.title || "";
  if (!out.image_url) out.image_url = meta("og:image","og:image:secure_url","twitter:image");
  if (out.prix == null){
    var p = meta("product:price:amount","og:price:amount","twitter:data1");
    if (p) { var v = parseFloat(String(p).replace(/[^\d.,]/g,"").replace(",", ".")); if (!isNaN(v)) out.prix = v; }
  }

  // 6c. Repli : la plus grande image de la page (signet uniquement)
  if (!out.image_url && doc === document){
    var best = null, aire = 0;
    Array.prototype.forEach.call(doc.images, function(im){
      var a = im.naturalWidth * im.naturalHeight;
      if (a > aire && im.naturalWidth > 220) { aire = a; best = im; }
    });
    if (best) out.image_url = best.currentSrc || best.src;
  }

  if (out.image_url) { try { out.image_url = new URL(out.image_url, href).href; } catch(e){} }
  out.titre = (out.titre || "").replace(/\s+/g," ").trim().slice(0,180);
  return out;
}

/* Enrichissement d'une URL collée. Passe par microlink (25 req/jour
   en gratuit). Échoue volontairement en silence sur les boutiques
   qui bloquent les robots : La Redoute et Kave Home renvoient
   EPROXYNEEDED. Dans ce cas, le signet est le seul chemin. */
function enrichir(url){
  return fetch("https://api.microlink.io/?url=" + encodeURIComponent(url))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.status !== "success") throw new Error(j.code || "échec");
      var d = j.data, h = "";
      try { h = new URL(url).hostname.replace(/^www\./,""); } catch(e){}
      return {
        url: url,
        titre: (d.title || "").slice(0,180),
        image_url: (d.image && d.image.url) || (d.logo && d.logo.url) || "",
        prix: null,
        boutique: d.publisher || h
      };
    });
}

/* =================================================================
   7. PANNEAU D'AJOUT
   ================================================================= */
var feuilleOuverte = null;
function fermerFeuille(){ if (feuilleOuverte) { feuilleOuverte.remove(); feuilleOuverte = null; } }

var feuillePersistante = false;
function ouvrirVoile(html, persistant){
  fermerFeuille();
  feuillePersistante = !!persistant;
  var v = document.createElement("div");
  v.className = "voile";
  v.innerHTML = '<div class="feuille">' + html + '</div>';
  if (!persistant) v.addEventListener("click", function(e){ if (e.target === v) fermerFeuille(); });
  document.body.appendChild(v);
  feuilleOuverte = v;
  return v;
}

function ouvrirAjout(data, idEdite){
  var d = data || { url:"", titre:"", image_url:"", prix:null, boutique:"" };
  // Venu du signet avec tout ce qu'il faut : on ne demande que la catégorie.
  // En modification, on montre tout, c'est justement le but.
  var complet = !idEdite && !!(d.url && d.titre);
  var cats = categories().map(function(c){ return c.nom; });
  CATS_BASE.forEach(function(c){ if (cats.indexOf(c) < 0) cats.push(c); });
  var pcs = pieces().map(function(p){ return p.nom; });
  var initPieces = Array.isArray(d.pieces) ? d.pieces.slice() : [];

  var v = ouvrirVoile(
      '<div class="feuille-tete"><h2>' + (idEdite ? "Modifier" : (complet ? "Ranger dans" : "Ajouter")) + '</h2>'
    + '<button class="btn btn--fantome" data-fermer>×</button></div>'
    + '<div id="zone-apercu"></div>'
    + '<p class="aide" style="margin:0 0 4px">Pièce(s)</p>'
    + '<div class="cats cats--grand" id="f-pieces">'
    +   pcs.map(function(p){ return '<button type="button" class="puce" data-piece="' + echapper(p) + '" aria-pressed="' + (initPieces.indexOf(p) > -1) + '">' + echapper(p) + '</button>'; }).join("")
    +   '<button type="button" class="puce puce--autre" id="f-piece-autre">+ Autre</button>'
    + '</div>'
    + '<div class="champ" id="champ-piece" hidden><input id="f-piece" type="text" placeholder="ou tape une autre pièce"></div>'
    + '<p class="aide" style="margin:10px 0 4px">Type de meuble</p>'
    + '<div class="cats cats--grand" id="f-cats">'
    +   cats.map(function(c){ return '<button type="button" class="puce" data-choix="' + echapper(c) + '">' + echapper(c) + '</button>'; }).join("")
    +   '<button type="button" class="puce puce--autre" id="f-autre">+ Autre</button>'
    + '</div>'
    + '<div class="champ" id="champ-cat"' + (complet ? ' hidden' : '') + '>'
    +   '<input id="f-cat" type="text" placeholder="ou tape un autre type" value="' + echapper(d.categorie || "") + '"></div>'
    + '<div id="details"' + (complet ? ' hidden' : '') + '>'
    +   '<div class="champ"><label for="f-url">Lien du produit</label>'
    +     '<input id="f-url" type="url" inputmode="url" placeholder="Colle le lien ici" value="' + echapper(d.url) + '"></div>'
    +   '<div class="champ"><label for="f-titre">Nom</label>'
    +     '<input id="f-titre" type="text" placeholder="Nom du meuble" value="' + echapper(d.titre) + '"></div>'
    +   '<div class="champ"><label for="f-image">Photo (lien de l\'image)</label>'
    +     '<input id="f-image" type="url" inputmode="url" placeholder="Clic droit sur la photo &gt; Copier l\'adresse de l\'image" value="' + echapper(d.image_url || "") + '"></div>'
    +   '<div class="champ"><label for="f-prix">Prix (facultatif)</label>'
    +     '<input id="f-prix" type="number" inputmode="decimal" step="0.01" placeholder="—" value="' + (d.prix != null ? echapper(d.prix) : "") + '"></div>'
    + '</div>'
    + (complet ? '<button class="lien-details" id="f-plus">Modifier les détails</button>' : '')
    + '<div class="actions-feuille" id="f-actions"' + (complet ? ' hidden' : '') + '>'
    +   '<button class="btn" data-fermer>Annuler</button>'
    +   '<button class="btn btn--primaire" id="f-ok">' + (idEdite ? "Enregistrer les modifications" : "Enregistrer") + '</button>'
    + '</div>'
  );

  var etat = { image_url: d.image_url || "", boutique: d.boutique || "" };
  var etatPieces = initPieces.slice();
  function reduit(){ return complet && v.querySelector("#details").hasAttribute("hidden"); }

  function majApercu(){
    var z = v.querySelector("#zone-apercu");
    var t = v.querySelector("#f-titre").value || "Sans nom";
    var pr = v.querySelector("#f-prix").value;
    z.innerHTML = '<div class="apercu">'
      + (etat.image_url
          ? '<img src="' + echapper(urlAffichage(etat.image_url)) + '" data-original="' + echapper(etat.image_url) + '" alt="" referrerpolicy="no-referrer" onerror="repliImage(this)">'
          : '<div class="apercu-vide">Sans photo</div>')
      + '<div class="apercu-txt"><b>' + echapper(t) + '</b><small>'
      + (pr ? Number(pr).toLocaleString("fr-FR", {maximumFractionDigits:0}) + ' € · ' : '')
      + echapper(etat.boutique || "—") + '</small></div></div>';
  }
  majApercu();
  v.querySelector("#f-titre").addEventListener("input", majApercu);
  v.querySelector("#f-prix").addEventListener("input", majApercu);
  v.querySelector("#f-image").addEventListener("input", function(){
    etat.image_url = this.value.trim(); majApercu();
  });

  function toutMontrer(){
    v.querySelector("#details").removeAttribute("hidden");
    v.querySelector("#champ-cat").removeAttribute("hidden");
    v.querySelector("#f-actions").removeAttribute("hidden");
    var l = v.querySelector("#f-plus"); if (l) l.remove();
  }

  function enregistrer(cat){
    var url = v.querySelector("#f-url").value.trim();
    if (!url) { toast("Il faut au moins un lien", true); toutMontrer(); v.querySelector("#f-url").focus(); return; }
    var prixBrut = v.querySelector("#f-prix").value;
    var btn = v.querySelector("#f-ok");
    if (btn) { btn.disabled = true; btn.textContent = "…"; }
    var champs = {
      url: url,
      titre: v.querySelector("#f-titre").value.trim(),
      image_url: (v.querySelector("#f-image").value.trim() || etat.image_url) || null,
      prix: prixBrut === "" ? null : parseFloat(prixBrut),
      boutique: etat.boutique || null,
      categorie: cat || null,
      pieces: etatPieces.slice()
    };
    var action;
    if (idEdite){
      action = Promise.resolve(modifier(idEdite, champs));
    } else {
      champs.ajoute_par = qui() || null;
      // Filtre la liste principale sur la pièce et la catégorie de cet
      // ajout, pour retrouver l'article sans bruit parmi les autres
      // fiches. Pièce laissée sur "Toutes" si 0 ou 2+ pièces cochées (le
      // filtre pièce de la page principale est single-select). Réglé
      // avant l'appel : ajouter() déclenche déjà le rendu ci-dessous.
      filtre = etatPieces.length === 1 ? etatPieces[0] : null;
      filtreCat = cat || null;
      action = ajouter(champs);
    }
    action.then(function(){
      fermerFeuille();
      toast(idEdite ? "Modifié" : (cat ? "Rangé dans " + cat : "Ajouté"));
    }).catch(function(e){
      if (btn) { btn.disabled = false; btn.textContent = "Enregistrer"; }
      toast("Échec : " + e.message, true);
    });
  }

  // Les pastilles pièces se cochent (plusieurs à la fois), mais ne
  // déclenchent jamais d'enregistrement : seul le type le fait (ci-
  // dessous), pour garder le geste rapide « un tap = rangé » du signet.
  v.querySelector("#f-pieces").addEventListener("click", function(e){
    if (e.target.closest("#f-piece-autre")){
      v.querySelector("#champ-piece").removeAttribute("hidden");
      v.querySelector("#f-piece").focus();
      return;
    }
    var b = e.target.closest("[data-piece]"); if (!b) return;
    var nom = b.dataset.piece, actif = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", String(!actif));
    var i = etatPieces.indexOf(nom);
    if (actif && i > -1) etatPieces.splice(i, 1);
    else if (!actif && i < 0) etatPieces.push(nom);
  });
  v.querySelector("#f-piece").addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    e.preventDefault();
    var nom = this.value.trim(); if (!nom) return;
    if (etatPieces.indexOf(nom) < 0) etatPieces.push(nom);
    this.value = "";
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "puce"; btn.dataset.piece = nom;
    btn.textContent = nom; btn.setAttribute("aria-pressed", "true");
    v.querySelector("#f-pieces").insertBefore(btn, v.querySelector("#f-piece-autre"));
  });

  // Une pastille = un rangement immédiat quand tout est déjà rempli
  v.querySelector("#f-cats").addEventListener("click", function(e){
    if (e.target.closest("#f-autre")){
      v.querySelector("#champ-cat").removeAttribute("hidden");
      v.querySelector("#f-cat").focus();
      return;
    }
    var b = e.target.closest("[data-choix]"); if (!b) return;
    if (reduit()) { enregistrer(b.dataset.choix); return; }
    v.querySelector("#f-cat").value = b.dataset.choix;
    Array.prototype.forEach.call(v.querySelectorAll("#f-cats .puce"), function(p){ p.setAttribute("aria-pressed", p === b); });
  });

  v.querySelector("#f-cat").addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    e.preventDefault();
    enregistrer(this.value.trim());
  });

  if (d.categorie){
    var courante = v.querySelector('#f-cats [data-choix="' + String(d.categorie).replace(/"/g,'') + '"]');
    if (courante) courante.setAttribute("aria-pressed", "true");
    v.querySelector("#champ-cat").removeAttribute("hidden");
  }

  var plus = v.querySelector("#f-plus");
  if (plus) plus.addEventListener("click", toutMontrer);

  var ok = v.querySelector("#f-ok");
  if (ok) ok.addEventListener("click", function(){ enregistrer(v.querySelector("#f-cat").value.trim()); });

  // Enrichissement quand on colle une URL à la main
  var champUrl = v.querySelector("#f-url");
  var derniere = "";
  function tenterEnrichir(){
    var u = champUrl.value.trim();
    if (!u || u === derniere || !/^https?:\/\//.test(u)) return;
    derniere = u;
    if (v.querySelector("#f-titre").value) return;
    etat.boutique = (function(){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } })();
    majApercu();
    v.querySelector("#zone-apercu").insertAdjacentHTML("beforeend", '<p class="aide">Recherche de la photo…</p>');
    enrichir(u).then(function(r){
      if (r.titre) v.querySelector("#f-titre").value = r.titre;
      if (r.image_url) { etat.image_url = r.image_url; v.querySelector("#f-image").value = r.image_url; }
      if (r.boutique) etat.boutique = r.boutique;
      majApercu();
    }).catch(function(){
      majApercu();
      v.querySelector("#zone-apercu").insertAdjacentHTML("beforeend",
        '<p class="aide"><b>Cette boutique bloque la lecture automatique.</b> IKEA, La Redoute et Kave Home sont dans ce cas. Le signet, lui, lit la page depuis ton navigateur et récupère tout d\'un coup : installe-le depuis <b>Commencer à utiliser l\'app</b>. Sinon, remplis le nom et la photo à la main.</p>');
    });
  }
  champUrl.addEventListener("change", tenterEnrichir);
  champUrl.addEventListener("paste", function(){ setTimeout(tenterEnrichir, 60); });

  v.addEventListener("click", function(e){ if (e.target.closest("[data-fermer]")) fermerFeuille(); });

  if (!d.url) setTimeout(function(){ champUrl.focus(); }, 120);
}

/* Demandé une seule fois, au tout premier lancement, sur chaque appareil. */
function demanderPrenom(){
  return new Promise(function(resolve){
    var v = ouvrirVoile(
        '<div class="feuille-tete"><h2>Bienvenue</h2></div>'
      + '<p class="aide" style="margin-bottom:16px">Ton prénom sera associé automatiquement aux meubles que tu ajoutes, pour savoir qui a repéré quoi. On ne te le redemandera plus.</p>'
      + '<div class="champ"><label for="w-qui">Ton prénom</label>'
      +   '<input id="w-qui" type="text" placeholder="Stéphanie" autocomplete="given-name"></div>'
      + '<div class="actions-feuille"><button class="btn btn--primaire" id="w-ok">C\'est parti</button></div>',
      true
    );
    var champ = v.querySelector("#w-qui");
    setTimeout(function(){ champ.focus(); }, 160);
    function valider(){
      var n = champ.value.trim();
      if (!n) { toast("Dis-moi ton prénom", true); champ.focus(); return; }
      localStorage.setItem(CLE_QUI, n);
      feuillePersistante = false;
      fermerFeuille(); rendre(); resolve();
    }
    v.querySelector("#w-ok").addEventListener("click", valider);
    champ.addEventListener("keydown", function(e){ if (e.key === "Enter") valider(); });
  });
}

/* Réorganiser les catégories par glisser-déposer, dans une liste à une
   seule colonne plutôt que dans la grille de vignettes : plus simple à
   suivre (une seule dimension) et plus fiable au doigt qu'un glisser
   dans une grille dont les lignes/colonnes changent selon la largeur. */
/* Tout ce qui touche une catégorie (ordre, nom, suppression) au même
   endroit, plutôt qu'éclaté entre la grille et cette fenêtre. */
function ligneReorgHTML(c){
  return '<li class="cat-ligne reorg-ligne" data-cat="' + echapper(c.nom) + '">'
    + '<span class="reorg-poignee" aria-hidden="true">⠿</span>'
    + '<input class="cat-nom-input" type="text" value="' + echapper(c.nom) + '" aria-label="Renommer ' + echapper(c.nom) + '">'
    + '<span class="cat-nb">' + c.n + '</span>'
    + '<button class="cat-act cat-act--danger" data-cat-suppr aria-label="Supprimer ' + echapper(c.nom) + '">✕</button>'
    + '</li>';
}

/* Branche renommage/suppression/glisser-déposer sur une des deux listes
   (pièces ou types). Générique sur {nom,n} : obtenirListe() est pieces()
   ou categories(), renommerOuSupprimer() est majPiece() ou majCategorie(). */
function brancherReorg(liste, obtenirListe, renommerOuSupprimer, poserOrdreFn, messageSuppr){
  function actualiser(){ liste.innerHTML = obtenirListe().map(ligneReorgHTML).join(""); }
  liste.addEventListener("change", function(e){
    var inp = e.target.closest(".cat-nom-input");
    if (!inp) return;
    var li = inp.closest("li"), ancien = li.dataset.cat, nouveau = inp.value.trim();
    if (!nouveau || nouveau === ancien) { inp.value = ancien; return; }
    renommerOuSupprimer(ancien, nouveau).then(actualiser);
  });
  liste.addEventListener("click", function(e){
    var b = e.target.closest("[data-cat-suppr]");
    if (!b) return;
    var li = b.closest("li"), nom = li.dataset.cat;
    if (!confirm(messageSuppr.replace("%s", nom))) return;
    renommerOuSupprimer(nom, null).then(function(){ toast("Supprimé"); actualiser(); });
  });
  activerGlisserListe(liste, poserOrdreFn);
}

/* Glisser-déposer sur une liste à une colonne (Pointer Events : même
   code pour souris et tactile). Le rang glissé suit le doigt/curseur
   librement (transform), les autres lignes se décalent d'une hauteur de
   ligne complète (H) quand on les dépasse. Ordre commité au relâcher.
   Écouteurs posés une seule fois sur la liste (délégation) : ils restent
   valables même après un innerHTML de renommage/suppression. */
function activerGlisserListe(liste, poserOrdreFn){
  if (!liste) return;
  var dragging = null, depart = 0, indexDepart = 0, indexAct = 0, H = 0, ordreVisuel = [];

  liste.addEventListener("pointerdown", function(e){
    var poignee = e.target.closest(".reorg-poignee");
    if (!poignee) return;
    dragging = poignee.closest("li");
    ordreVisuel = Array.prototype.slice.call(liste.children);
    indexDepart = indexAct = ordreVisuel.indexOf(dragging);
    depart = e.clientY;
    H = dragging.getBoundingClientRect().height;
    dragging.classList.add("reorg-drag");
    dragging.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  liste.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var dy = e.clientY - depart;
    dragging.style.transform = "translateY(" + dy + "px)";
    var cible = indexDepart + Math.round(dy / H);
    cible = Math.max(0, Math.min(ordreVisuel.length - 1, cible));
    if (cible !== indexAct){
      var pas = cible > indexAct ? 1 : -1;
      for (var i = indexAct; i !== cible; i += pas){
        ordreVisuel[i + pas].style.transition = "transform .15s ease";
        ordreVisuel[i + pas].style.transform = "translateY(" + (-pas * H) + "px)";
      }
      indexAct = cible;
    }
  });

  function relacher(e){
    if (!dragging) return;
    ordreVisuel.forEach(function(li){
      li.style.transition = ""; li.style.transform = "";
    });
    ordreVisuel.splice(indexDepart, 1);
    ordreVisuel.splice(indexAct, 0, dragging);
    ordreVisuel.forEach(function(li){ liste.appendChild(li); });
    dragging.classList.remove("reorg-drag");
    dragging = null;
    poserOrdreFn(ordreVisuel.map(function(li){ return li.dataset.cat; }));
    rendre();
  }
  liste.addEventListener("pointerup", relacher);
  liste.addEventListener("pointercancel", relacher);
}

function majCommandes(){
  var groupe = vue === "cat" || vue === "piece" || vue === "mag";   // sections affichées, colonnes pertinentes
  $("#seg-col").hidden = !groupe;
  // Réorganiser (flèches ↑↓) n'a de sens qu'en vue « Par catégorie » : le
  // champ `rang` est scopé au type, pas à la pièce (cf. index.html §3/§4).
  $("#btn-gerer").hidden = vue !== "cat";
  $("#btn-reorganiser-pieces").hidden = !groupe;
  $("#btn-reorganiser-pieces").disabled = pieces().length < 1;
  $("#btn-reorganiser-cats").hidden = !groupe;
  $("#btn-reorganiser-cats").disabled = categories().length < 1;
  Array.prototype.forEach.call($("#seg-col").querySelectorAll("button"), function(x){
    x.setAttribute("aria-pressed", x.dataset.col === colonnes);
  });
}

$("#seg-col").addEventListener("click", function(e){

  colonnes = b.dataset.col;
  localStorage.setItem(CLE_COL, colonnes);
  rendre();
});

// Arrivée depuis le signet ou le raccourci iOS : #add=<json>
function lireHash(){
  var m = location.hash.match(/^#add=(.*)$/);
  if (!m) return;
  var d = null;
  try { d = JSON.parse(decodeURIComponent(m[1])); } catch(e){}
  history.replaceState(null, "", location.pathname + location.search);
  if (d && d.url) ouvrirAjout(d);
}

  if (!document.hidden && partage) charger();
});

charger()
  .then(function(){ return qui() ? null : demanderPrenom(); })
  .then(lireHash);
addEventListener("hashchange", lireHash);
