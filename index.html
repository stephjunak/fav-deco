<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fav-deco</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EFEDE8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Déco">
<style>
/* ---------------------------------------------------------------
   fav-deco - favoris meubles partagés
   Direction : interface de collection d'images (Pinterest / Are.na).
   L'UI se tait, les photos parlent. Palette achromatique volontaire :
   la couleur vient des meubles. Fond greige pour détacher les
   visuels produit, qui sont presque tous shootés sur fond blanc.
   --------------------------------------------------------------- */
:root{
  /* Neutres chauds - 90% de l'interface */
  --n-0:#FFFFFF;
  --n-50:#F7F5F1;
  --n-100:#EFEDE8;
  --n-200:#E3E0D9;
  --n-300:#CFCBC2;
  --n-400:#A8A399;
  --n-500:#7D7871;
  --n-600:#5A5650;
  --n-900:#1C1A17;

  --bg:var(--n-100);
  --surface:var(--n-0);
  --text:var(--n-900);
  --text-muted:var(--n-600);
  --text-subtle:var(--n-500);
  --border:var(--n-200);
  --border-strong:var(--n-300);

  /* Accent = encre. Aucune couleur, pour ne pas concurrencer les photos. */
  --primary:var(--n-900);
  --on-primary:var(--n-0);

  --danger:#A8342B;

  --r-img:10px;
  --r-pill:999px;
  --gouttiere:14px;

  --ease:cubic-bezier(.3,.7,.4,1);
}
*{box-sizing:border-box}
/* display:flex sur .actions-feuille écrase la règle UA de [hidden], d'où ce rappel */
[hidden]{display:none !important}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}

/* ---------- En-tête ---------- */
.tete{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .2s;
  padding-top:env(safe-area-inset-top);
}
.tete[data-colle]{border-bottom-color:var(--border)}
.tete-haut{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px 10px;
  max-width:1400px;margin:0 auto;
}
.marque{
  font-size:16px;font-weight:600;letter-spacing:-.02em;margin:0;
  display:flex;align-items:baseline;gap:8px;
}
.compte{
  font-size:12px;font-weight:400;color:var(--text-subtle);
  font-variant-numeric:tabular-nums;
}
.tete-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{
  border:1px solid var(--border-strong);background:var(--surface);
  border-radius:var(--r-pill);padding:8px 14px;font-size:14px;font-weight:500;
  transition:background .15s,border-color .15s,transform .1s var(--ease);
}
.btn:hover{background:var(--n-50);border-color:var(--n-400)}
.btn:active{transform:scale(.97)}
.btn--primaire{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn--primaire:hover{background:#332F2A;border-color:#332F2A}
.btn--fantome{border-color:transparent;background:transparent;color:var(--text-muted);padding:8px 10px}
.btn--fantome:hover{background:var(--n-200);color:var(--text)}
.btn--danger{color:var(--danger)}

/* ---------- Filtres ---------- */
.barre{
  display:flex;gap:8px;align-items:center;
  padding:0 16px 10px;max-width:1400px;margin:0 auto;
}
.barre:last-child{padding-bottom:12px}
.seg{
  display:inline-flex;flex:0 0 auto;background:var(--n-200);
  border-radius:var(--r-pill);padding:3px;gap:2px;
}
.seg button{
  border:none;background:none;border-radius:var(--r-pill);
  padding:6px 12px;font-size:13px;color:var(--text-muted);white-space:nowrap;
  transition:background .15s,color .15s;
}
.seg button[aria-pressed="true"]{
  background:var(--surface);color:var(--text);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.09);
}

/* Choix du nombre de colonnes, à la manière des sites e-commerce */
.cols{display:inline-flex;flex:0 0 auto;gap:2px;background:var(--n-200);border-radius:var(--r-pill);padding:3px}
.cols button{
  border:none;background:none;border-radius:var(--r-pill);padding:6px 8px;
  display:grid;place-items:center;color:var(--text-subtle);line-height:0;
  transition:background .15s,color .15s;
}
.cols button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.09)}
.cols svg{display:block}

.btn--petit{padding:6px 11px;font-size:13px}
.btn--actif{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn--actif:hover{background:#332F2A;color:var(--on-primary)}

/* Mode gestion : les commandes apparaissent sur les titres de section */
.sec-actions{display:inline-flex;gap:0;margin-left:auto;flex:0 0 auto}
.sec-actions .cat-act{flex:0 0 auto;padding:4px 5px}
.section-titre--gestion{
  background:var(--n-200);border-radius:8px;padding:4px 4px 4px 9px;margin-bottom:10px;
}
.section-titre--gestion .sec-nom{
  border:none;background:none;padding:0;font:inherit;color:inherit;
  letter-spacing:inherit;text-transform:inherit;text-decoration:underline;
  text-underline-offset:3px;cursor:text;
  /* doit pouvoir rétrécir, sinon la ligne déborde de la colonne */
  min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sec-renom{
  flex:1;min-width:0;font-size:13px;padding:4px 7px;border:1px solid var(--n-900);
  border-radius:6px;background:var(--surface);color:var(--text);
}
.filtres{
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  flex:1;min-width:0;
  -webkit-overflow-scrolling:touch;
}
.barre:has(.filtres:empty){display:none}
.filtres::-webkit-scrollbar{display:none}
.puce{
  flex:0 0 auto;border:1px solid var(--border-strong);background:transparent;
  border-radius:var(--r-pill);padding:6px 13px;font-size:13.5px;white-space:nowrap;
  color:var(--text-muted);
  transition:background .15s,color .15s,border-color .15s;
}
.puce:hover{border-color:var(--n-400);color:var(--text)}
.puce[aria-pressed="true"]{
  background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:500;
}
.puce .n{opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}

/* ---------- Grille en colonnes (hauteurs libres) ---------- */
#contenu{max-width:1400px;margin:0 auto;padding:10px 16px 80px}

/* Vue par catégorie : les sections coulent en colonnes, pour que deux
   petites catégories se retrouvent côte à côte au lieu de prendre
   chacune une ligne entière. Les vignettes ont un ratio fixe, donc leur
   hauteur est connue avant le chargement des photos : c'est ce qui rend
   ce découpage en colonnes fiable ici. */
/* Grille, et non colonnes libres : les rangées démarrent toutes à la
   même hauteur. Les colonnes libres décalaient les sections les unes par
   rapport aux autres dès que leurs hauteurs différaient. */
#contenu[data-vue="cat"]{display:grid;gap:4px 30px;align-items:start}
#contenu[data-vue="cat"][data-col="1"]{grid-template-columns:1fr}
#contenu[data-vue="cat"][data-col="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
#contenu[data-vue="cat"][data-col="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}

/* Séparation entre colonnes de catégories : un trait posé dans l'espace
   entre les colonnes (pseudo-élément), jamais une bordure/un padding sur
   la section elle-même. Un border-left grignotait 27px de largeur côté
   droit, donc ses vignettes finissaient plus petites que celles de la
   colonne de gauche : la 1ère demande était « toutes les images à
   l'écran de la même taille ». */
.section{position:relative}
#contenu[data-vue="cat"][data-col="2"] .section:nth-child(2n)::before,
#contenu[data-vue="cat"][data-col="3"] .section:not(:nth-child(3n+1))::before{
  content:"";position:absolute;top:2px;bottom:2px;left:-15px;
  width:1px;background:var(--border-strong);
}

.section{margin:0 0 22px;min-width:0}
.section-titre{
  display:flex;align-items:baseline;gap:8px;margin:0 0 12px;min-width:0;
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);
}
.section-n{
  font-size:11px;font-weight:400;color:var(--text-subtle);
  font-variant-numeric:tabular-nums;letter-spacing:0;flex:0 0 auto;
}

.grille{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--gouttiere);align-items:start;
}
/* Taille des vignettes par catégorie : dépend du nombre de colonnes de
   catégories choisi, pas d'une largeur minimale fixe. Une section pleine
   largeur (1 colonne) doit paraître aussi grande qu'en vue « Tout » ; à
   2 ou 3 colonnes, chaque section est plus étroite, donc moins de
   vignettes par rangée, en restant lisible. */
#contenu[data-vue="tout"] .grille,
#contenu[data-vue="cat"][data-col="1"] .grille{ grid-template-columns:repeat(2,minmax(0,1fr)); }
@media(min-width:640px){
  #contenu[data-vue="tout"] .grille,
  #contenu[data-vue="cat"][data-col="1"] .grille{ grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media(min-width:980px){
  :root{--gouttiere:18px}
  #contenu[data-vue="tout"] .grille,
  #contenu[data-vue="cat"][data-col="1"] .grille{ grid-template-columns:repeat(4,minmax(0,1fr)); }
}
@media(min-width:1300px){
  #contenu[data-vue="tout"] .grille,
  #contenu[data-vue="cat"][data-col="1"] .grille{ grid-template-columns:repeat(5,minmax(0,1fr)); }
}

/* Nombre de colonnes de produits fixé explicitement, pas déduit de la
   largeur (auto-fill) : le trait de séparation retire 27px aux sections
   qui ne sont pas en première position, donc auto-fill y calait moins
   de vignettes par rangée, plus grandes que chez leurs voisines. Un
   compte fixe garantit la même taille de vignette dans toutes les
   catégories, quelle que soit leur position. */
#contenu[data-vue="cat"][data-col="2"] .grille{ grid-template-columns:repeat(1,minmax(0,1fr)); }
@media(min-width:640px){ #contenu[data-vue="cat"][data-col="2"] .grille{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

#contenu[data-vue="cat"][data-col="3"] .grille{ grid-template-columns:repeat(2,minmax(0,1fr)); }

.tuile{
  position:relative;min-width:0;
  animation:apparait .3s var(--ease) both;
}

/* La plaque : ratio fixe, donc la place est réservée avant que la
   photo n'arrive. Fond blanc parce que les boutiques shootent sur
   blanc, et contain pour ne jamais recadrer un meuble de travers. */
.tuile-media{
  aspect-ratio:4/5;background:var(--surface);border-radius:var(--r-img);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
}
@keyframes apparait{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tuile-lien{display:block;text-decoration:none;position:relative}
.tuile-img{
  /* max-width/max-height plutôt que width/height:100% + object-fit :
     centre et ne rogne jamais, y compris sur les photos très verticales
     (portrait, type 9:16), quel que soit le navigateur. */
  display:block;max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;padding:7px;box-sizing:border-box;
  transition:filter .25s var(--ease);
}
.tuile-lien:hover .tuile-img{filter:brightness(.94)}

/* Repli quand la photo manque ou refuse de se charger */
.tuile-vide{
  width:100%;height:100%;background:var(--surface);
  border:1px dashed var(--border-strong);border-radius:var(--r-img);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;
}
.tuile-vide span{font-size:12px;color:var(--text-subtle);letter-spacing:.06em;text-transform:uppercase}
.tuile-vide strong{font-size:13px;font-weight:500;color:var(--text-muted)}

.tuile-info{padding:8px 3px 0}
.tuile-titre{
  font-size:13.5px;line-height:1.35;margin:0;font-weight:450;
  text-wrap:pretty;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tuile-meta{
  display:flex;align-items:center;gap:6px;margin-top:3px;
  font-size:12px;color:var(--text-subtle);
}
.tuile-prix{
  font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums;
  white-space:nowrap;flex:0 0 auto;      /* « 339 € » ne doit jamais se couper */
}
.tuile-sep{opacity:.4;flex:0 0 auto}
.tuile-boutique{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tuile-qui{
  margin-left:auto;flex:0 0 auto;width:17px;height:17px;border-radius:50%;
  display:grid;place-items:center;font-size:9.5px;font-weight:600;
  background:var(--n-200);color:var(--text-muted);letter-spacing:0;
}

/* Menu de tuile */
.tuile-menu{
  position:absolute;top:7px;right:7px;
  width:28px;height:28px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);color:var(--n-900);
  display:grid;place-items:center;font-size:15px;line-height:1;
  box-shadow:0 1px 4px rgba(0,0,0,.16);
  opacity:0;transition:opacity .18s;
}
.tuile:hover .tuile-menu,.tuile-menu:focus-visible,.tuile-menu[data-ouvert]{opacity:1}
@media(hover:none){ .tuile-menu{opacity:.9} }

/* Croix de suppression, posée à gauche du menu « ··· » */
.tuile-suppr{
  position:absolute;top:7px;right:41px;
  width:28px;height:28px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);color:var(--danger);
  display:grid;place-items:center;font-size:14px;line-height:1;
  box-shadow:0 1px 4px rgba(0,0,0,.16);
  opacity:0;transition:opacity .18s,background .15s;
}
.tuile-suppr:hover{background:#FDEBE8}
.tuile:hover .tuile-suppr,.tuile-suppr:focus-visible{opacity:1}
@media(hover:none){ .tuile-suppr{opacity:.9} }

/* Réorganiser un article au sein de sa catégorie, en mode Gérer */
.tuile-reorg{display:flex;gap:2px;margin-top:5px}

.pop{
  position:absolute;top:38px;right:7px;z-index:12;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 8px 26px rgba(0,0,0,.14);padding:5px;min-width:172px;
  animation:apparait .14s var(--ease) both;
}
.pop button{
  display:block;width:100%;text-align:left;border:none;background:none;
  padding:8px 10px;border-radius:8px;font-size:13.5px;
}
.pop button:hover{background:var(--n-100)}
.pop hr{border:none;border-top:1px solid var(--border);margin:4px 2px}
.pop-titre{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-subtle);padding:6px 10px 3px;
}

/* ---------- État vide ---------- */
.vide{
  grid-column:1/-1;text-align:center;padding:70px 24px;max-width:420px;margin:0 auto;
}
.vide h2{font-size:17px;font-weight:600;margin:0 0 8px}
.vide p{color:var(--text-muted);font-size:14px;margin:0 0 20px;text-wrap:pretty}

/* ---------- Panneau (feuille mobile / dialogue bureau) ---------- */
.voile{
  position:fixed;inset:0;z-index:50;background:rgba(28,26,23,.32);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fondu .18s ease both;
  backdrop-filter:blur(2px);
}
@keyframes fondu{from{opacity:0}to{opacity:1}}
@media(min-width:640px){ .voile{align-items:center;padding:24px} }

.feuille{
  background:var(--bg);width:100%;max-width:440px;
  border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;
  animation:monte .26s var(--ease) both;
}
@keyframes monte{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:640px){
  .feuille{border-radius:16px;animation-name:apparait}
}
.feuille-tete{display:flex;align-items:center;margin-bottom:14px}
.feuille-tete h2{font-size:16px;font-weight:600;margin:0}
.feuille-tete .btn--fantome{margin-left:auto;font-size:20px;line-height:1;padding:2px 8px}

.apercu{
  display:flex;gap:12px;margin-bottom:16px;padding:10px;
  background:var(--surface);border-radius:12px;border:1px solid var(--border);
}
.apercu img{
  width:78px;height:78px;object-fit:contain;border-radius:8px;flex:0 0 auto;
  background:var(--n-50);
}
.apercu-vide{
  width:78px;height:78px;border-radius:8px;flex:0 0 auto;background:var(--n-100);
  border:1px dashed var(--border-strong);display:grid;place-items:center;
  font-size:10px;color:var(--text-subtle);text-align:center;padding:4px;
}
.apercu-txt{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px}
.apercu-txt b{font-size:13.5px;font-weight:500;line-height:1.3}
.apercu-txt small{font-size:12px;color:var(--text-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.champ{margin-bottom:13px}
.champ label{
  display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-subtle);margin-bottom:5px;font-weight:600;
}
.champ input{
  width:100%;padding:10px 12px;font-size:16px; /* 16px = pas de zoom auto iOS */
  border:1px solid var(--border-strong);border-radius:10px;
  background:var(--surface);color:var(--text);
}
.champ input:focus{outline:2px solid var(--n-900);outline-offset:-1px;border-color:transparent}

.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cats--grand{gap:8px;margin:2px 0 4px}
.cats--grand .puce{padding:11px 17px;font-size:15px;border-color:var(--border-strong)}
.cats--grand .puce:active{transform:scale(.96)}
.puce--autre{border-style:dashed;color:var(--text-subtle)}
.lien-details{
  display:inline-block;margin-top:14px;background:none;border:none;padding:4px 0;
  font-size:13px;color:var(--text-subtle);text-decoration:underline;text-underline-offset:3px;
}
.lien-details:hover{color:var(--text)}
.actions-feuille{display:flex;gap:8px;margin-top:18px}
.actions-feuille .btn{flex:1;justify-content:center;text-align:center;padding:11px}

.aide{font-size:12px;color:var(--text-subtle);line-height:1.5;text-wrap:pretty}

/* Gestion des catégories */
.cat-ligne{
  display:flex;align-items:center;gap:6px;padding:7px 4px 7px 10px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;
}
.cat-nom{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-nb{font-size:11.5px;color:var(--text-subtle);font-variant-numeric:tabular-nums;flex:0 0 auto}
.cat-act{
  flex:0 0 auto;border:none;background:none;padding:5px 7px;border-radius:7px;
  font-size:13px;color:var(--text-subtle);line-height:1;
}
.cat-act:hover{background:var(--n-100);color:var(--text)}
.cat-act:disabled{opacity:.25;cursor:default}
.cat-act--danger:hover{background:#F7E4E1;color:var(--danger)}
.aide code{
  background:var(--n-200);padding:1px 5px;border-radius:4px;font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.signet-lien{
  display:inline-block;margin:8px 0;padding:9px 16px;border-radius:var(--r-pill);
  background:var(--primary);color:var(--on-primary);text-decoration:none;
  font-size:14px;font-weight:500;cursor:grab;
}

/* ---------- Bandeau d'état ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:80;
  background:var(--n-900);color:var(--n-0);
  padding:10px 10px 10px 18px;border-radius:var(--r-pill);font-size:13.5px;
  box-shadow:0 6px 22px rgba(0,0,0,.24);
  animation:apparait .2s var(--ease) both;
  max-width:calc(100vw - 32px);
  display:flex;align-items:center;gap:10px;
}
.toast[data-err]{background:var(--danger)}
.toast-action{
  flex:0 0 auto;border:none;background:rgba(255,255,255,.18);color:inherit;
  padding:6px 13px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;
}
.toast-action:hover{background:rgba(255,255,255,.28)}

.alerte{
  max-width:1400px;margin:0 auto;padding:11px 16px;

<script>
/* Icône d'écran d'accueil iPhone : iOS n'accepte pas le SVG pour
   apple-touch-icon, on la dessine donc au chargement (même astuce que
   Suivi ventes Vinted). Reprend le motif de icon.svg. */
(function(){
  try{
    var T=180,c=document.createElement("canvas");c.width=c.height=T;
    var x=c.getContext("2d"),k=T/512;
    function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);
      x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill();}
    x.fillStyle="#1C1A17";rr(0,0,T,T,112*k);
    x.fillStyle="#EFEDE8";
    [[112,112,130,170],[270,112,130,106],[112,310,130,90],[270,246,130,154]]
      .forEach(function(t){rr(t[0]*k,t[1]*k,t[2]*k,t[3]*k,16*k)});
    var l=document.createElement("link");
    l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");
    document.head.appendChild(l);
  }catch(e){}
})();
</script>

      <button data-col="3" aria-label="Trois colonnes" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="1" y="1" width="3.4" height="13" rx="1.1"/><rect x="5.8" y="1" width="3.4" height="13" rx="1.1"/><rect x="10.6" y="1" width="3.4" height="13" rx="1.1"/></svg></button>
    </div>

  </div>
  <div class="barre"><div class="filtres" id="filtres"></div></div>
</header>

<main id="contenu"></main>

<script>
(function(){
"use strict";

/* =================================================================
   1. CONFIGURATION
   Renseigne ces deux valeurs après avoir créé le projet Supabase.
   Tant qu'elles sont vides, l'app tourne en local sur cet appareil
   seulement (rien n'est partagé), ce qui permet de l'essayer tout
   de suite.
   ================================================================= */
var SB_URL = "";   // ex: https://xxxxxxxx.supabase.co/rest/v1
var SB_KEY = "";   // clé anon (publishable)

var TABLE  = "favoris";
var CLE_LOCALE = "favdeco:items";
var CLE_QUI    = "favdeco:qui";
var CLE_VUE    = "favdeco:vue";
var CLE_ORDRE  = "favdeco:ordre";
var CLE_COL    = "favdeco:col";

var partage = !!(SB_URL && SB_KEY);
var entetes = {
  "apikey": SB_KEY,
  "Authorization": "Bearer " + SB_KEY,
  "Content-Type": "application/json"
};

/* =================================================================
   2. ÉTAT
   ================================================================= */
var articles = [];
var filtre = null;          // null = tout
var vue = localStorage.getItem("favdeco:vue") === "tout" ? "tout" : "cat";
var colonnes = ["1","2","3"].indexOf(localStorage.getItem("favdeco:col")) > -1
             ? localStorage.getItem("favdeco:col") : "2";
var gestion = false;
var popOuvert = null;
var CATS_BASE = ["Canapé","Table","Chaise","Luminaire","Rangement","Lit","Déco","Tapis"];

var $ = function(s){ return document.querySelector(s); };
var contenu = $("#contenu"), zoneFiltres = $("#filtres"), zoneCompte = $("#compte");

function echapper(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* Affichage des photos via wsrv.nl plutôt qu'en hotlink direct vers le
   site du vendeur : leur serveur n'est visité qu'une fois, wsrv.nl garde
   ensuite sa propre copie en cache (CDN Cloudflare) et la ressert à tous
   les viewers, y compris après un vidage de cache local. Vérifié le
   18/08/2026 : cf-cache-status passe à HIT dès le 2e appel.
   On ne stocke JAMAIS l'URL proxifiée : la base garde l'adresse réelle
   (utile pour l'édition, et pour ne pas dépendre d'un service tiers si
   on en change un jour), seul l'affichage passe par le proxy. */
function urlAffichage(u){
  if (!u) return u;
  if (/^data:|^blob:|^https?:\/\/wsrv\.nl\//.test(u)) return u;   // déjà local ou déjà proxifié
  return "https://wsrv.nl/?url=" + encodeURIComponent(u) + "&w=640&output=webp";
}

/* Si la version proxifiée échoue, on affiche directement le repli
   « indisponible ». PAS de tentative en direct chez le vendeur : ce
   serait exactement le hotlinking que ce proxy existe pour éviter.
   Certaines boutiques (Sklum, sur leur variante "-large_default")
   bloquent le proxy sur une image précise ; dans ce cas la photo manque
   plutôt que d'être hotlinkée. Le vrai correctif est de corriger l'URL
   stockée sur la fiche (voir « Modifier la fiche »), pas de hotlinker. */
function repliImage(img){
  videMedia(img);
}
function videMedia(img, texte){
  var zone = img.closest(".tuile-media, .apercu");
  var boutique = img.dataset.boutique || "";
  var html = zone && zone.classList.contains("apercu")
    ? '<div class="apercu-vide">Photo<br>indisponible</div>'
    : '<div class="tuile-vide"><span>' + (texte || "Photo indisponible") + '</span>'
      + (boutique ? '<strong>' + echapper(boutique) + '</strong>' : '') + '</div>';
  (zone || img.parentNode).innerHTML = html;
}
// Ce fichier est enfermé dans une IIFE : un attribut HTML inline
// (onerror="repliImage(this)") s'exécute dans le contexte global, donc
// invisible sans cet export explicite. Piège vécu le 18/08/2026 : la
// fonction existait, marchait au test direct, mais ne se déclenchait
// jamais depuis une vraie image cassée (ReferenceError silencieuse).
window.repliImage = repliImage;
/* action optionnelle : { libelle, fait() }, ajoute un bouton (ex. Annuler) */
function toast(msg, err, action){
  var t = document.createElement("div");
  t.className = "toast";
  if (err) t.setAttribute("data-err","");
  var texte = document.createElement("span");
  texte.textContent = msg;
  t.appendChild(texte);
  if (action){
    var b = document.createElement("button");
    b.type = "button"; b.className = "toast-action"; b.textContent = action.libelle;
    b.addEventListener("click", function(){ t.remove(); action.fait(); });
    t.appendChild(b);
  }
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, action ? 5000 : (err ? 4200 : 2100));
}
function qui(){ return localStorage.getItem(CLE_QUI) || ""; }

/* =================================================================
   3. STOCKAGE  (Supabase REST, ou localStorage si non configuré)
   ================================================================= */
function lireLocal(){
  try { return JSON.parse(localStorage.getItem(CLE_LOCALE) || "[]"); }
  catch(e){ return []; }
}
function ecrireLocal(a){ localStorage.setItem(CLE_LOCALE, JSON.stringify(a)); }

function charger(){
  if (!partage) {
    articles = lireLocal().filter(function(a){ return !a.supprime; });
    rendre();
    return Promise.resolve();
  }
  return fetch(SB_URL + "/" + TABLE + "?supprime=eq.false&select=*&order=cree_le.desc", { headers: entetes })
    .then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data){
      // Garde-fou repris de vinted-search : ne jamais remplacer un
      // affichage rempli par une réponse vide (incident du 01/07/2026).
      if ((!data || !data.length) && articles.length) {
        console.warn("Réponse vide ignorée, l'affichage est conservé.");
        return;
      }
      articles = data || [];
      rendre();
    })
    .catch(function(e){
      console.error(e);
      if (!articles.length) toast("Connexion impossible : " + e.message, true);
    });
}

function ajouter(obj){
  obj.cree_le = new Date().toISOString();
  obj.supprime = false;
  if (!partage) {
    obj.id = Date.now();
    articles.unshift(obj); ecrireLocal(articles); rendre();
    return Promise.resolve();
  }
  return fetch(SB_URL + "/" + TABLE, {
    method: "POST",
    headers: Object.assign({}, entetes, { "Prefer": "return=representation" }),
    body: JSON.stringify(obj)
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(t || ("HTTP " + r.status)); });
    return r.json();
  }).then(function(rows){
    if (rows && rows[0]) articles.unshift(rows[0]);
    rendre();
  });
}

function modifier(id, patch){
  var i = articles.findIndex(function(a){ return String(a.id) === String(id); });
  if (i > -1) Object.assign(articles[i], patch);
  if (patch.supprime && i > -1) articles.splice(i, 1);
  rendre();
  if (!partage) {
    var tout = lireLocal(), j = tout.findIndex(function(a){ return String(a.id) === String(id); });
    if (j > -1) { Object.assign(tout[j], patch); ecrireLocal(tout); }
    return Promise.resolve();
  }
  return fetch(SB_URL + "/" + TABLE + "?id=eq." + encodeURIComponent(id), {
    method: "PATCH", headers: entetes, body: JSON.stringify(patch)
  }).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); })
    .catch(function(e){ toast("Modification non enregistrée : " + e.message, true); charger(); });
}

/* Renomme une catégorie partout. nouveau = null vide la catégorie,
   les meubles retombent dans « Sans catégorie » et ne sont jamais perdus. */
function majCategorie(ancien, nouveau){
  articles.forEach(function(a){ if (a.categorie === ancien) a.categorie = nouveau; });
  var o = ordre(), i = o.indexOf(ancien);
  if (i > -1){ if (nouveau) o[i] = nouveau; else o.splice(i, 1); poserOrdre(o); }
  if (filtre === ancien) filtre = nouveau;
  rendre();

  if (!partage){
    var tout = lireLocal();
    tout.forEach(function(a){ if (a.categorie === ancien) a.categorie = nouveau; });
    ecrireLocal(tout);
    return Promise.resolve();
  }
  return fetch(SB_URL + "/" + TABLE + "?categorie=eq." + encodeURIComponent(ancien), {
    method: "PATCH", headers: entetes, body: JSON.stringify({ categorie: nouveau })
  }).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); })
    .catch(function(e){ toast("Non enregistré : " + e.message, true); charger(); });
}

function deplacerCategorie(nom, delta){
  var liste = categories().map(function(c){ return c.nom; });
  var i = liste.indexOf(nom), j = i + delta;
  if (i < 0 || j < 0 || j >= liste.length) return;
  liste.splice(j, 0, liste.splice(i, 1)[0]);
  poserOrdre(liste);
  rendre();
}

/* Ordre des articles À L'INTÉRIEUR d'une catégorie : champ `rang`, partagé
   (Supabase), à la différence de l'ordre des catégories qui reste local à
   chaque appareil. Sans rang (valeur par défaut), l'ordre reste celui de
   l'ajout, le plus récent en premier. */
function triCategorie(liste){
  return liste.slice().sort(function(x, y){
    var rx = x.rang, ry = y.rang;
    if (rx != null && ry != null) return rx - ry;
    if (rx != null) return -1;
    if (ry != null) return 1;
    return 0;   // tri stable : garde l'ordre déjà affiché
  });
}

function deplacerArticle(id, delta){
  var a = articles.find(function(x){ return String(x.id) === String(id); });
  if (!a) return;
  var cat = a.categorie || SANS_CAT;
  var freres = triCategorie(articles.filter(function(x){ return (x.categorie || SANS_CAT) === cat; }));
  var i = freres.findIndex(function(x){ return String(x.id) === String(id); });
  var j = i + delta;
  if (i < 0 || j < 0 || j >= freres.length) return;
  freres.splice(j, 0, freres.splice(i, 1)[0]);
  freres.forEach(function(x, idx){
    var nv = (idx + 1) * 10;
    if (x.rang !== nv) modifier(x.id, { rang: nv });
  });
}

/* Suppression douce avec un court délai d'annulation : la croix est
   accessible en un clic, contrairement à l'ancien « Retirer » planqué
   dans le menu, donc elle mérite un filet de sécurité. */
function supprimerArticle(id){
  var i = articles.findIndex(function(x){ return String(x.id) === String(id); });
  if (i < 0) return;
  var copie = Object.assign({}, articles[i]), pos = i;
  modifier(id, { supprime:true });
  toast("Retiré", false, {
    libelle: "Annuler",
    fait: function(){
      articles.splice(Math.min(pos, articles.length), 0, copie);
      rendre();
      if (!partage){
        var tout = lireLocal(), j = tout.findIndex(function(x){ return String(x.id) === String(id); });
        if (j > -1){ tout[j].supprime = false; ecrireLocal(tout); }
        return;
      }
      fetch(SB_URL + "/" + TABLE + "?id=eq." + encodeURIComponent(id), {
        method: "PATCH", headers: entetes, body: JSON.stringify({ supprime:false })
      }).catch(function(e){ toast("Annulation non enregistrée : " + e.message, true); });
    }
  });
}

/* =================================================================
   4. RENDU
   ================================================================= */
function ordre(){
  try { return JSON.parse(localStorage.getItem(CLE_ORDRE) || "[]"); } catch(e){ return []; }
}
function poserOrdre(liste){ localStorage.setItem(CLE_ORDRE, JSON.stringify(liste)); }

/* Les catégories rangées à la main passent devant, dans l'ordre choisi.
   Les nouvelles arrivent ensuite, par ordre alphabétique. */
function categories(){
  var vues = {};
  articles.forEach(function(a){ if (a.categorie) vues[a.categorie] = (vues[a.categorie] || 0) + 1; });
  var o = ordre();
  return Object.keys(vues).sort(function(x, y){
    var ix = o.indexOf(x), iy = o.indexOf(y);
    if (ix > -1 && iy > -1) return ix - iy;
    if (ix > -1) return -1;
    if (iy > -1) return 1;
    return x.localeCompare(y, "fr");
  }).map(function(c){ return { nom:c, n:vues[c] }; });
}

function rendreFiltres(){
  var cats = categories();
  var h = '<button class="puce" data-cat="" aria-pressed="' + (filtre === null) + '">Toutes'
        + (articles.length ? ' <span class="n">' + articles.length + '</span>' : '') + '</button>';
  cats.forEach(function(c){
    h += '<button class="puce" data-cat="' + echapper(c.nom) + '" aria-pressed="'
      + (filtre === c.nom) + '">' + echapper(c.nom) + ' <span class="n">' + c.n + '</span></button>';
  });
  zoneFiltres.innerHTML = cats.length ? h : "";
}

function tuileHTML(a, ctx){
  ctx = ctx || {};
  var img = a.image_url
    ? '<img class="tuile-img" src="' + echapper(urlAffichage(a.image_url)) + '" data-boutique="' + echapper(a.boutique || "") + '" alt="' + echapper(a.titre || "") + '"'
      + ' loading="lazy" referrerpolicy="no-referrer" onerror="repliImage(this)">'
    : '<div class="tuile-vide"><span>Sans photo</span><strong>' + echapper(a.boutique || "") + '</strong></div>';

  var prix = (a.prix != null && a.prix !== "")
    ? '<span class="tuile-prix">' + Number(a.prix).toLocaleString("fr-FR", {maximumFractionDigits:0}) + ' €</span><span class="tuile-sep">·</span>'
    : "";

  var init = a.ajoute_par ? '<span class="tuile-qui" title="Ajouté par ' + echapper(a.ajoute_par) + '">'
    + echapper(a.ajoute_par.trim().charAt(0).toUpperCase()) + '</span>' : "";

  var reorg = "";
  if (gestion && ctx.dansListe){
    reorg = '<div class="tuile-reorg">'
      + '<button class="cat-act" data-art-monter="' + echapper(a.id) + '"' + (ctx.premier ? ' disabled' : '') + ' aria-label="Monter dans la catégorie">↑</button>'
      + '<button class="cat-act" data-art-descendre="' + echapper(a.id) + '"' + (ctx.dernier ? ' disabled' : '') + ' aria-label="Descendre dans la catégorie">↓</button>'
      + '</div>';
  }

  return '<article class="tuile" data-id="' + echapper(a.id) + '">'
    + '<a class="tuile-lien" href="' + echapper(a.url) + '" target="_blank" rel="noopener noreferrer">'
    +   '<div class="tuile-media">' + img + '</div></a>'
    + '<button class="tuile-menu" data-menu="' + echapper(a.id) + '" aria-label="Options">···</button>'
    + '<button class="tuile-suppr" data-suppr="' + echapper(a.id) + '" aria-label="Retirer">✕</button>'
    + '<div class="tuile-info">'
    +   '<p class="tuile-titre">' + echapper(a.titre || a.url) + '</p>'
    +   '<div class="tuile-meta">' + prix
    +     '<span class="tuile-boutique">' + echapper(a.boutique || "") + '</span>' + init
    +   '</div>' + reorg
    + '</div></article>';
}

var SANS_CAT = "Sans catégorie";

function rendre(){
  rendreFiltres();
  zoneCompte.textContent = articles.length ? articles.length + (articles.length > 1 ? " trouvailles" : " trouvaille") : "";

  if (!articles.length){
    contenu.innerHTML = '<div class="vide">'
      + '<h2>Rien pour l\'instant</h2>'
      + '<p>Ajoute un premier meuble en collant son lien, ou installe le signet pour l\'attraper en un clic depuis la boutique.</p>'
      + '<button class="btn btn--primaire" data-action="ajouter">Coller un lien</button>'
      + '<p class="aide" style="margin-top:18px">La plupart des boutiques bloquent la lecture automatique d\'un lien collé. Pour tout récupérer en un clic, installe le signet depuis <b>Réglages</b>.</p>'
      + '</div>';
    return;
  }

  contenu.setAttribute("data-vue", vue);
  contenu.setAttribute("data-col", colonnes);
  majCommandes();

  var liste = filtre === null ? articles : articles.filter(function(a){ return a.categorie === filtre; });

  if (!liste.length){
    contenu.innerHTML = '<div class="vide"><h2>Rien dans « ' + echapper(filtre) + ' »</h2>'
      + '<p>Cette catégorie est vide pour le moment.</p></div>';
    return;
  }

  // Vue « Tout » : une seule grille, sans titres de section, pas de
  // réorganisation (elle n'a de sens qu'à l'intérieur d'une catégorie)
  if (vue === "tout"){
    contenu.innerHTML = '<div class="grille">' + liste.map(function(a){ return tuileHTML(a); }).join("") + '</div>';
    return;
  }

  // Vue « Catégories » : une section par catégorie
  var groupes = {};
  liste.forEach(function(a){
    var c = a.categorie || SANS_CAT;
    (groupes[c] = groupes[c] || []).push(a);
  });

  var rang = categories().map(function(c){ return c.nom; });
  var noms = Object.keys(groupes).sort(function(x, y){
    if (x === SANS_CAT) return 1;          // toujours en dernier
    if (y === SANS_CAT) return -1;
    return rang.indexOf(x) - rang.indexOf(y);
  });

  var bougeables = noms.filter(function(x){ return x !== SANS_CAT; });

  contenu.innerHTML = noms.map(function(n){
    var titre;
    if (gestion && n !== SANS_CAT){
      var im = bougeables.indexOf(n);
      titre = '<h2 class="section-titre section-titre--gestion">'
        + '<button class="sec-nom" data-cat-renommer="' + echapper(n) + '">' + echapper(n) + '</button>'
        + '<span class="section-n">' + groupes[n].length + '</span>'
        + '<span class="sec-actions">'
        +   '<button class="cat-act" data-cat-monter="' + echapper(n) + '"' + (im === 0 ? ' disabled' : '') + ' aria-label="Monter">↑</button>'
        +   '<button class="cat-act" data-cat-descendre="' + echapper(n) + '"' + (im === bougeables.length - 1 ? ' disabled' : '') + ' aria-label="Descendre">↓</button>'
        +   '<button class="cat-act cat-act--danger" data-cat-suppr="' + echapper(n) + '" aria-label="Supprimer">✕</button>'
        + '</span></h2>';
    } else {
      titre = '<h2 class="section-titre">' + echapper(n)
        + '<span class="section-n">' + groupes[n].length + '</span></h2>';
    }
    var membres = triCategorie(groupes[n]);
    return '<section class="section">' + titre
      + '<div class="grille">' + membres.map(function(a, i){
          return tuileHTML(a, { dansListe:true, premier: i === 0, dernier: i === membres.length - 1 });
        }).join("") + '</div>'
      + '</section>';
  }).join("");
}

/* =================================================================
   5. MENU DE TUILE
   ================================================================= */
function fermerPop(){ if (popOuvert) { popOuvert.remove(); popOuvert = null; } }

/* Réduit à « Modifier la fiche » : le changement de catégorie se fait
   désormais depuis cette fiche (elle a déjà les pastilles), et retirer un
   article a sa propre croix directement sur la vignette. */
function ouvrirPop(id, bouton){
  fermerPop();
  var a = articles.find(function(x){ return String(x.id) === String(id); });
  if (!a) return;

  var pop = document.createElement("div");
  pop.className = "pop";
  pop.innerHTML = '<button data-modifier="1">Modifier la fiche</button>';

  bouton.parentNode.appendChild(pop);
  bouton.setAttribute("data-ouvert","");
  popOuvert = pop;

  pop.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.modifier) ouvrirAjout(a, a.id);
    fermerPop();
  });
}

document.addEventListener("click", function(e){
  var m = e.target.closest("[data-menu]");
  if (m) { e.preventDefault(); ouvrirPop(m.dataset.menu, m); return; }
  var s = e.target.closest("[data-suppr]");
  if (s) { e.preventDefault(); supprimerArticle(s.dataset.suppr); return; }
  if (!e.target.closest(".pop")) fermerPop();

  var p = e.target.closest("[data-cat]");
  if (p && p.classList.contains("puce")) {
    filtre = p.dataset.cat || null;
    rendre();
    window.scrollTo({ top:0, behavior:"smooth" });
  }
  if (e.target.closest('[data-action="ajouter"]')) ouvrirAjout(null);
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape") { fermerPop(); if (!feuillePersistante) fermerFeuille(); } });

/* =================================================================
   6. EXTRACTION DES DONNÉES PRODUIT
   Même logique que le signet. Ordre : JSON-LD (le plus fiable en
   e-commerce), puis OpenGraph, puis repli.
   ================================================================= */
function extraireDepuisDoc(doc, href){
  var out = { url: href, titre:"", image_url:"", prix:null, boutique:"" };
  try { out.boutique = new URL(href).hostname.replace(/^www\./, ""); } catch(e){}

  // 6a. JSON-LD Product
  var blocs = doc.querySelectorAll('script[type="application/ld+json"]');
  for (var i = 0; i < blocs.length && !out.titre; i++){
    try {
      var j = JSON.parse(blocs[i].textContent);
      var pile = Array.isArray(j) ? j.slice() : [j];
      while (pile.length){
        var n = pile.shift();
        if (!n || typeof n !== "object") continue;
        if (n["@graph"]) { pile = pile.concat(n["@graph"]); continue; }
        var t = n["@type"];
        var estProduit = t === "Product" || (Array.isArray(t) && t.indexOf("Product") > -1);
        if (!estProduit) continue;
        out.titre = n.name || "";
        var im = n.image;
        if (Array.isArray(im)) im = im[0];
        if (im && typeof im === "object") im = im.url || im.contentUrl;
        if (im) out.image_url = im;
        var of = n.offers; if (Array.isArray(of)) of = of[0];
        if (of && of.price != null) out.prix = parseFloat(String(of.price).replace(",", "."));
        break;
      }
    } catch(e){}
  }

  // 6b. OpenGraph
  function meta(){
    for (var k = 0; k < arguments.length; k++){
      var el = doc.querySelector('meta[property="' + arguments[k] + '"], meta[name="' + arguments[k] + '"]');
      if (el && el.content) return el.content;
    }
    return "";
  }
  if (!out.titre)     out.titre     = meta("og:title","twitter:title") || doc.title || "";
  if (!out.image_url) out.image_url = meta("og:image","og:image:secure_url","twitter:image");
  if (out.prix == null){
    var p = meta("product:price:amount","og:price:amount","twitter:data1");
    if (p) { var v = parseFloat(String(p).replace(/[^\d.,]/g,"").replace(",", ".")); if (!isNaN(v)) out.prix = v; }
  }

  // 6c. Repli : la plus grande image de la page (signet uniquement)
  if (!out.image_url && doc === document){
    var best = null, aire = 0;
    Array.prototype.forEach.call(doc.images, function(im){
      var a = im.naturalWidth * im.naturalHeight;
      if (a > aire && im.naturalWidth > 220) { aire = a; best = im; }
    });
    if (best) out.image_url = best.currentSrc || best.src;
  }

  if (out.image_url) { try { out.image_url = new URL(out.image_url, href).href; } catch(e){} }
  out.titre = (out.titre || "").replace(/\s+/g," ").trim().slice(0,180);
  return out;
}

/* Enrichissement d'une URL collée. Passe par microlink (25 req/jour
   en gratuit). Échoue volontairement en silence sur les boutiques
   qui bloquent les robots : La Redoute et Kave Home renvoient
   EPROXYNEEDED. Dans ce cas, le signet est le seul chemin. */
function enrichir(url){
  return fetch("https://api.microlink.io/?url=" + encodeURIComponent(url))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.status !== "success") throw new Error(j.code || "échec");
      var d = j.data, h = "";
      try { h = new URL(url).hostname.replace(/^www\./,""); } catch(e){}
      return {
        url: url,
        titre: (d.title || "").slice(0,180),
        image_url: (d.image && d.image.url) || (d.logo && d.logo.url) || "",
        prix: null,
        boutique: d.publisher || h
      };
    });
}

/* =================================================================
   7. PANNEAU D'AJOUT
   ================================================================= */
var feuilleOuverte = null;
function fermerFeuille(){ if (feuilleOuverte) { feuilleOuverte.remove(); feuilleOuverte = null; } }

var feuillePersistante = false;
function ouvrirVoile(html, persistant){
  fermerFeuille();
  feuillePersistante = !!persistant;
  var v = document.createElement("div");
  v.className = "voile";
  v.innerHTML = '<div class="feuille">' + html + '</div>';
  if (!persistant) v.addEventListener("click", function(e){ if (e.target === v) fermerFeuille(); });
  document.body.appendChild(v);
  feuilleOuverte = v;
  return v;
}

function ouvrirAjout(data, idEdite){
  var d = data || { url:"", titre:"", image_url:"", prix:null, boutique:"" };
  // Venu du signet avec tout ce qu'il faut : on ne demande que la catégorie.
  // En modification, on montre tout, c'est justement le but.
  var complet = !idEdite && !!(d.url && d.titre);
  var cats = categories().map(function(c){ return c.nom; });
  CATS_BASE.forEach(function(c){ if (cats.indexOf(c) < 0) cats.push(c); });

  var v = ouvrirVoile(
      '<div class="feuille-tete"><h2>' + (idEdite ? "Modifier" : (complet ? "Ranger dans" : "Ajouter")) + '</h2>'
    + '<button class="btn btn--fantome" data-fermer>×</button></div>'
    + '<div id="zone-apercu"></div>'
    + '<div class="cats cats--grand" id="f-cats">'
    +   cats.map(function(c){ return '<button type="button" class="puce" data-choix="' + echapper(c) + '">' + echapper(c) + '</button>'; }).join("")
    +   '<button type="button" class="puce puce--autre" id="f-autre">+ Autre</button>'
    + '</div>'
    + '<div class="champ" id="champ-cat"' + (complet ? ' hidden' : '') + '>'
    +   '<input id="f-cat" type="text" placeholder="ou tape une autre catégorie" value="' + echapper(d.categorie || "") + '"></div>'
    + '<div id="details"' + (complet ? ' hidden' : '') + '>'
    +   '<div class="champ"><label for="f-url">Lien du produit</label>'
    +     '<input id="f-url" type="url" inputmode="url" placeholder="Colle le lien ici" value="' + echapper(d.url) + '"></div>'
    +   '<div class="champ"><label for="f-titre">Nom</label>'
    +     '<input id="f-titre" type="text" placeholder="Nom du meuble" value="' + echapper(d.titre) + '"></div>'
    +   '<div class="champ"><label for="f-image">Photo (lien de l\'image)</label>'
    +     '<input id="f-image" type="url" inputmode="url" placeholder="Clic droit sur la photo &gt; Copier l\'adresse de l\'image" value="' + echapper(d.image_url || "") + '"></div>'
    +   '<div class="champ"><label for="f-prix">Prix (facultatif)</label>'
    +     '<input id="f-prix" type="number" inputmode="decimal" step="0.01" placeholder="—" value="' + (d.prix != null ? echapper(d.prix) : "") + '"></div>'
    + '</div>'
    + (complet ? '<button class="lien-details" id="f-plus">Modifier les détails</button>' : '')
    + '<div class="actions-feuille" id="f-actions"' + (complet ? ' hidden' : '') + '>'
    +   '<button class="btn" data-fermer>Annuler</button>'
    +   '<button class="btn btn--primaire" id="f-ok">' + (idEdite ? "Enregistrer les modifications" : "Enregistrer") + '</button>'
    + '</div>'
  );

  var etat = { image_url: d.image_url || "", boutique: d.boutique || "" };
  function reduit(){ return complet && v.querySelector("#details").hasAttribute("hidden"); }

  function majApercu(){
    var z = v.querySelector("#zone-apercu");
    var t = v.querySelector("#f-titre").value || "Sans nom";
    var pr = v.querySelector("#f-prix").value;
    z.innerHTML = '<div class="apercu">'
      + (etat.image_url
          ? '<img src="' + echapper(urlAffichage(etat.image_url)) + '" alt="" referrerpolicy="no-referrer" onerror="repliImage(this)">'
          : '<div class="apercu-vide">Sans photo</div>')
      + '<div class="apercu-txt"><b>' + echapper(t) + '</b><small>'
      + (pr ? Number(pr).toLocaleString("fr-FR", {maximumFractionDigits:0}) + ' € · ' : '')
      + echapper(etat.boutique || "—") + '</small></div></div>';
  }
  majApercu();
  v.querySelector("#f-titre").addEventListener("input", majApercu);
  v.querySelector("#f-prix").addEventListener("input", majApercu);
  v.querySelector("#f-image").addEventListener("input", function(){
    etat.image_url = this.value.trim(); majApercu();
  });

  function toutMontrer(){
    v.querySelector("#details").removeAttribute("hidden");
    v.querySelector("#champ-cat").removeAttribute("hidden");
    v.querySelector("#f-actions").removeAttribute("hidden");
    var l = v.querySelector("#f-plus"); if (l) l.remove();
  }

  function enregistrer(cat){
    var url = v.querySelector("#f-url").value.trim();
    if (!url) { toast("Il faut au moins un lien", true); toutMontrer(); v.querySelector("#f-url").focus(); return; }
    var prixBrut = v.querySelector("#f-prix").value;
    var btn = v.querySelector("#f-ok");
    if (btn) { btn.disabled = true; btn.textContent = "…"; }
    var champs = {
      url: url,
      titre: v.querySelector("#f-titre").value.trim(),
      image_url: (v.querySelector("#f-image").value.trim() || etat.image_url) || null,
      prix: prixBrut === "" ? null : parseFloat(prixBrut),
      boutique: etat.boutique || null,
      categorie: cat || null
    };
    var action;
    if (idEdite){
      action = Promise.resolve(modifier(idEdite, champs));
    } else {
      champs.ajoute_par = qui() || null;
      action = ajouter(champs);
    }
    action.then(function(){
      fermerFeuille();
      toast(idEdite ? "Modifié" : (cat ? "Rangé dans " + cat : "Ajouté"));
    }).catch(function(e){
      if (btn) { btn.disabled = false; btn.textContent = "Enregistrer"; }
      toast("Échec : " + e.message, true);
    });
  }

  // Une pastille = un rangement immédiat quand tout est déjà rempli
  v.querySelector("#f-cats").addEventListener("click", function(e){
    if (e.target.closest("#f-autre")){
      v.querySelector("#champ-cat").removeAttribute("hidden");
      v.querySelector("#f-cat").focus();
      return;
    }
    var b = e.target.closest("[data-choix]"); if (!b) return;
    if (reduit()) { enregistrer(b.dataset.choix); return; }
    v.querySelector("#f-cat").value = b.dataset.choix;
    Array.prototype.forEach.call(v.querySelectorAll("#f-cats .puce"), function(p){ p.setAttribute("aria-pressed", p === b); });
  });

  v.querySelector("#f-cat").addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    e.preventDefault();
    enregistrer(this.value.trim());
  });

  if (d.categorie){
    var courante = v.querySelector('#f-cats [data-choix="' + String(d.categorie).replace(/"/g,'') + '"]');
    if (courante) courante.setAttribute("aria-pressed", "true");
    v.querySelector("#champ-cat").removeAttribute("hidden");
  }

  var plus = v.querySelector("#f-plus");
  if (plus) plus.addEventListener("click", toutMontrer);

  var ok = v.querySelector("#f-ok");
  if (ok) ok.addEventListener("click", function(){ enregistrer(v.querySelector("#f-cat").value.trim()); });

  // Enrichissement quand on colle une URL à la main
  var champUrl = v.querySelector("#f-url");
  var derniere = "";
  function tenterEnrichir(){
    var u = champUrl.value.trim();
    if (!u || u === derniere || !/^https?:\/\//.test(u)) return;
    derniere = u;
    if (v.querySelector("#f-titre").value) return;
    etat.boutique = (function(){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } })();
    majApercu();
    v.querySelector("#zone-apercu").insertAdjacentHTML("beforeend", '<p class="aide">Recherche de la photo…</p>');
    enrichir(u).then(function(r){
      if (r.titre) v.querySelector("#f-titre").value = r.titre;
      if (r.image_url) { etat.image_url = r.image_url; v.querySelector("#f-image").value = r.image_url; }
      if (r.boutique) etat.boutique = r.boutique;
      majApercu();
    }).catch(function(){
      majApercu();
      v.querySelector("#zone-apercu").insertAdjacentHTML("beforeend",
        '<p class="aide"><b>Cette boutique bloque la lecture automatique.</b> IKEA, La Redoute et Kave Home sont dans ce cas. Le signet, lui, lit la page depuis ton navigateur et récupère tout d\'un coup : installe-le depuis Réglages. Sinon, remplis le nom et la photo à la main.</p>');
    });
  }
  champUrl.addEventListener("change", tenterEnrichir);
  champUrl.addEventListener("paste", function(){ setTimeout(tenterEnrichir, 60); });

  v.addEventListener("click", function(e){ if (e.target.closest("[data-fermer]")) fermerFeuille(); });

  if (!d.url) setTimeout(function(){ champUrl.focus(); }, 120);
}

function demanderPrenom(){
  return new Promise(function(resolve){
    var v = ouvrirVoile(
        '<div class="feuille-tete"><h2>Bienvenue</h2></div>'
      + '<p class="aide" style="margin-bottom:16px">Ton prénom sera associé automatiquement aux meubles que tu ajoutes, pour savoir qui a repéré quoi. On ne te le redemandera plus.</p>'

      + '<div class="actions-feuille"><button class="btn btn--primaire" id="w-ok">C\'est parti</button></div>',
      true
    );
    var champ = v.querySelector("#w-qui");
    setTimeout(function(){ champ.focus(); }, 160);

      var n = champ.value.trim();

    +   '6. Colle le code ci-dessous à l\'intérieur (bouton juste en dessous).<br>'
    +   '7. Ajoute enfin l\'action <b>Ouvrir les URL</b>, branchée sur le résultat du JavaScript.'
    + '</p>'
    + '<button class="btn btn--primaire" id="r-copier-ios" style="width:100%;margin:4px 0 8px">Copier le code du raccourci</button>'
    + '<textarea id="r-code-ios" readonly rows="3" style="width:100%;font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:8px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text-muted);resize:vertical"></textarea>'
    + '<p class="aide" style="margin-top:10px">À l\'usage : sur la page d\'un produit dans Safari, bouton Partager, puis <b>Ajouter à la déco</b>. La première fois, iOS demande d\'autoriser le JavaScript sur la page : c\'est normal, accepte, sinon le raccourci ne peut rien lire.</p>'
    + '<div class="actions-feuille"><button class="btn btn--primaire" data-fermer>Fermer</button></div>'
  );
  var code = codeSignet();
  v.querySelector("#r-code").value = code;
  v.querySelector("#r-signet").setAttribute("href", code);
  v.querySelector("#r-copier").addEventListener("click", function(){
    var zone = v.querySelector("#r-code");
    function manuel(){ zone.focus(); zone.select(); toast("Sélectionné : fais Cmd+C pour copier"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function(){ toast("Code copié"); }, manuel);
    } else manuel();
  });
  v.querySelector("#r-signet").addEventListener("click", function(e){
    e.preventDefault();
    toast("Fais-le glisser dans la barre de favoris, ne clique pas dessus");
  });
  var codeIOS = codeRaccourciIOS();
  v.querySelector("#r-code-ios").value = codeIOS;
  v.querySelector("#r-copier-ios").addEventListener("click", function(){
    var zone = v.querySelector("#r-code-ios");
    function manuel(){ zone.focus(); zone.select(); toast("Sélectionné : fais Cmd+C pour copier"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(codeIOS).then(function(){ toast("Code copié"); }, manuel);
    } else manuel();
  });
  v.querySelector("#r-qui").addEventListener("change", function(){
    localStorage.setItem(CLE_QUI, this.value.trim());
  });
  v.addEventListener("click", function(e){ if (e.target.closest("[data-fermer]")) fermerFeuille(); });
}

/* Gestion des catégories directement sur les titres de section */
function renommerSection(bouton, nom){
  var inp = document.createElement("input");
  inp.type = "text"; inp.className = "sec-renom"; inp.value = nom;
  bouton.replaceWith(inp);
  inp.focus(); inp.select();
  var fait = false;
  function valider(){
    if (fait) return; fait = true;
    var nv = inp.value.trim();
    if (nv && nv !== nom){ majCategorie(nom, nv); toast("Renommée en " + nv); }
    else rendre();
  }
  inp.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); valider(); }
    else if (e.key === "Escape"){ fait = true; rendre(); }
  });
  inp.addEventListener("blur", valider);
}

$("#contenu").addEventListener("click", function(e){
  var art = e.target.closest("[data-art-monter],[data-art-descendre]");
  if (art){
    e.preventDefault();
    if (art.hasAttribute("data-art-monter")) return deplacerArticle(art.dataset.artMonter, -1);
    return deplacerArticle(art.dataset.artDescendre, 1);
  }
  var b = e.target.closest("[data-cat-monter],[data-cat-descendre],[data-cat-suppr],[data-cat-renommer]");
  if (!b) return;
  e.preventDefault();
  if (b.hasAttribute("data-cat-monter"))    return deplacerCategorie(b.dataset.catMonter, -1);
  if (b.hasAttribute("data-cat-descendre")) return deplacerCategorie(b.dataset.catDescendre, 1);
  if (b.hasAttribute("data-cat-renommer"))  return renommerSection(b, b.dataset.catRenommer);
  var n = b.dataset.catSuppr;
  if (!confirm('Supprimer la catégorie « ' + n + ' » ?\n\nAucun meuble ne sera supprimé, ils repasseront dans « Sans catégorie ».')) return;
  majCategorie(n, null);
  toast("Catégorie supprimée");
});

$("#seg-vue").addEventListener("click", function(e){
  var b = e.target.closest("[data-vue]"); if (!b) return;
  vue = b.dataset.vue;
  localStorage.setItem(CLE_VUE, vue);
  Array.prototype.forEach.call(this.querySelectorAll("button"), function(x){
    x.setAttribute("aria-pressed", x === b);
  });
  rendre();
  window.scrollTo({ top:0, behavior:"smooth" });
});
Array.prototype.forEach.call($("#seg-vue").querySelectorAll("button"), function(x){

});

addEventListener("scroll", function(){

// Arrivée depuis le signet ou le raccourci iOS : #add=<json>
function lireHash(){
  var m = location.hash.match(/^#add=(.*)$/);
  if (!m) return;
  var d = null;
  try { d = JSON.parse(decodeURIComponent(m[1])); } catch(e){}
  history.replaceState(null, "", location.pathname + location.search);
  if (d && d.url) ouvrirAjout(d);
}

// Chacun voit les ajouts de l'autre au retour sur l'onglet
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && partage) charger();
});

charger()
  .then(function(){ return qui() ? null : demanderPrenom(); })
  .then(lireHash);
addEventListener("hashchange", lireHash);

})();
